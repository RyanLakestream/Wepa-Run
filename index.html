  if(G.hitFlash>0){
    cx.globalAlpha=G.hitFlash/14*0.45;
    cx.fillStyle=getVigGrad();
    cx.fillRect(0,0,W,H);
    cx.globalAlpha=1;
  }

  drawTouchUI();
}

function drawTouchUI(){
  // ── DIFFICULTY TIER INDICATOR — top-right corner ──
  if(G&&G.diff){
    var tier=G.diff.tier;
    var flash=G.diff.tierFlash>0;
    var barW=70, barH=8, bx=W-barW-8, by=56;
    // Background track
    cx.globalAlpha=0.55;
    cx.fillStyle='#000';cx.fillRect(bx-2,by-2,barW+4,barH+4);
    cx.globalAlpha=1;
    // Filled pips (10 total)
    for(var i=0;i<10;i++){
      var pipW=Math.floor((barW-9)/10);
      var px2=bx+i*(pipW+1);
      cx.globalAlpha = i<tier ? (flash&&G.fr%8<4?1:0.85) : 0.2;
      // Color shifts warm to hot as difficulty rises
      var hue = i<3?'#20c060':i<6?'#f8d020':i<9?'#f06020':'#e03020';
      cx.fillStyle = i<tier ? hue : '#444';
      cx.fillRect(px2, by, pipW, barH);
    }
    cx.globalAlpha=1;
    // "SPD" label
    cx.fillStyle=flash&&G.fr%8<4?'#f8d020':'#888';
    cx.font='4px "Press Start 2P"';
    cx.textAlign='left';
    cx.fillText('SPD',bx,by-3);
  }

  // Tap ripple at touch point
  if(touchFlash.t>0){
    var r=touchFlash.t;
    cx.globalAlpha=(r/12)*.5;
    cx.strokeStyle='#f8d020';cx.lineWidth=2;
    cx.beginPath();cx.arc(touchFlash.x,touchFlash.y,(12-r)*8,0,Math.PI*2);cx.stroke();
    cx.globalAlpha=1;
    touchFlash.t--;
  }
  // Jump hint — fades out after first few seconds
  if(G.fr<220){
    var alpha=G.fr<180?0.7:0.7*(1-(G.fr-180)/40);
    cx.globalAlpha=alpha;
    cx.fillStyle='rgba(0,0,0,.5)';cx.fillRect(W/2-70,H-36,140,24);
    cx.strokeStyle='#f8d020';cx.lineWidth=1;cx.strokeRect(W/2-70,H-36,140,24);
    cx.fillStyle='#f8d020';cx.font='6px "Press Start 2P"';cx.textAlign='center';
    cx.fillText('TAP = JUMP',W/2,H-19);
    cx.textAlign='left';
    cx.globalAlpha=1;
  }
  // Jumps remaining indicator (small dots above player)
  if(G.p.jumps>0&&!G.p.flyT){
    var maxJ=G.charId==='abuela'?4:3;
    var used=G.p.jumps;
    for(var i=0;i<maxJ;i++){
      cx.globalAlpha=0.7;
      cx.fillStyle=i<used?'#444':'#f8d020';
      cx.fillRect(G.p.x+G.p.w/2-maxJ*5+i*10,G.p.y-12,7,7);
    }
    cx.globalAlpha=1;
  }
}

// ─── LIMPIOSO BOTTLES ───
// A purple cleaning bottle inspired by Fabuloso — rainbow shimmer, comedic label
var _rbPal=['#ff4040','#ff8020','#ffe020','#40e040','#2080ff','#8020ff','#e020c0','#40e0e0'];
function drawBottles(){
  cx.save();
  var fr=G?G.fr:0;
  for(var i=0;i<G.bottles.length;i++){
    var b=G.bottles[i];
    var bx=b.x, by=b.y+Math.sin(b.bob)*5;
    var bw=b.w, bh=b.h; // 22×38

    // Drop shadow
    cx.globalAlpha=.22;f('#000',bx+2,by+bh,bw-4,5);cx.globalAlpha=1;

    // ── RAINBOW GLOW AURA — cycles through precomputed palette (no hsl() parse) ──
    var hueIdx=Math.floor((fr*0.13+i*1.7))&7; // fast modulo 8 with bitmask
    cx.globalAlpha=.28+Math.sin(fr*.09+i)*.14;
    cx.fillStyle=_rbPal[hueIdx];
    cx.fillRect(Math.round(bx-5),Math.round(by-5),bw+10,bh+10);
    cx.globalAlpha=1;

    // ── BOTTLE BODY — tapered, Fabuloso-style ──
    // Neck (cap)
    f('#d0d8e8',bx+bw*.22,by,bw*.56,bh*.14);         // cap ring
    f('#f0f4ff',bx+bw*.28,by-7,bw*.44,8);             // nozzle top
    f('#c8d0e4',bx+bw*.3,by-7,3,8);                   // nozzle shadow

    // Bottle body — deep purple
    f('#5c0e94',bx+1,by+bh*.12,bw-2,bh*.88);
    // Purple gradient shading (lighter left edge)
    f('#7c18c4',bx+2,by+bh*.13,bw*.28,bh*.86);
    f('#9828e0',bx+2,by+bh*.14,bw*.14,bh*.82);        // bright highlight stripe

    // ── RAINBOW STRIPE BAND — the signature Fabuloso stripe ──
    var stripeY=by+bh*.28, stripeH=bh*.1;
    var stripes=['#ff2020','#ff8020','#ffe020','#20e040','#2080ff','#8020ff'];
    for(var si=0;si<stripes.length;si++){
      f(stripes[si],bx+1,stripeY+si*(stripeH/stripes.length),bw-2,Math.ceil(stripeH/stripes.length)+1);
    }

    // ── LABEL AREA — white rectangle on bottle ──
    f('#f0f0f8',bx+2,by+bh*.40,bw-4,bh*.36);
    f('#d8d0f0',bx+3,by+bh*.41,bw-6,2);               // label top edge

    // "LIMPIOSO" — comedic stacked text
    cx.fillStyle='#5c0e94';cx.font='bold 5px monospace';cx.textAlign='center';
    cx.fillText('LIMPIOSO',bx+bw/2,by+bh*.52);
    // Tagline: ¡LIMPIA TODO!
    cx.fillStyle='#8020c0';cx.font='3px monospace';
    cx.fillText('¡LIMPIA TODO!',bx+bw/2,by+bh*.60);
    // Small star sparkles on label
    cx.fillStyle='#f8d020';cx.font='5px monospace';
    cx.fillText('✦',bx+3,by+bh*.58);
    cx.fillText('✦',bx+bw-5,by+bh*.56);
    cx.textAlign='left';

    // Bottle bottom rounded edge
    f('#4a0878',bx+1,by+bh*.90,bw-2,bh*.08);
    f('#380060',bx+3,by+bh*.95,bw-6,bh*.04);

    // Shine streak
    cx.globalAlpha=.45;f('#e0c0ff',bx+3,by+bh*.15,3,bh*.6);cx.globalAlpha=1;

    // ── ANIMATED SPARKLE STARS — float around bottle ──
    var sparkCols=['#ff40ff','#40ffff','#ffff40','#ff4080','#40ff80'];
    for(var si=0;si<3;si++){
      var angle=(fr*.06+i*1.1+si*2.1);
      var sr=bw*.7+Math.sin(fr*.04+si)*3;
      var sx2=bx+bw/2+Math.cos(angle)*sr;
      var sy2=by+bh/2+Math.sin(angle)*sr*.5;
      cx.globalAlpha=.6+Math.sin(fr*.1+si)*.35;
      cx.fillStyle=sparkCols[(si+Math.floor(fr*.05))%sparkCols.length];
      cx.font='7px monospace';cx.textAlign='center';
      cx.fillText('✦',sx2,sy2);
    }
    cx.textAlign='left';cx.globalAlpha=1;
  }
  cx.restore();
}

// ─── GUAGUAS ───
// gType: 0=standard  1=long (articulado)  2=vintage (viejo modelo)
// Hitbox always uses g.w/g.h — only drawing changes.
function drawGuaguas(){

    var x=g.x,y=g.y,w=g.w,h=g.h,c=g.cols;

// ─── PARTICLES ───
function drawPts(){
  for(var i=0;i<G.pts.length;i++){
    var pt=G.pts[i];
    var alpha=Math.min(1,pt.l/22);
    cx.globalAlpha=alpha;
    if(pt.type==='dust'){
      cx.fillStyle=pt.col;
      cx.beginPath();
      cx.arc(pt.x,pt.y,Math.max(1,pt.sz*(pt.l/20)),0,Math.PI*2);
      cx.fill();
    } else {
      f(pt.col,pt.x-pt.sz/2,pt.y-pt.sz/2,pt.sz,pt.sz);
    }
  }

// ── COQUITO CHICITO ── tiny person in a giant coquito bottle costume
// The bottle is the whole silhouette — round body, cap on head, label reads "Boya"
function drawChicito_at(x,y,rf,grab,turbo){
  var la=rf<2,pw=50,ph=70,fr=G?G.fr:titleFr;
  // Wider shadow for the round bottle
  cx.globalAlpha=.22;f('#000',x+4,y+ph,pw-8,10);cx.globalAlpha=1;

  // ── TINY LEGS sticking out the bottom of the bottle ──
  // Feet — little sneakers poking out, waddling
  var lx=x+(la?8:18), rx=x+(la?24:16);
  var waddleL=Math.sin(fr*.22)*4, waddleR=-waddleL;
  f('#f8f8f8',lx,y+ph-10+waddleL,16,10); // left shoe
  f('#e03020',lx+1,y+ph-8+waddleL,12,3); // red lace
  f('#ccc',lx,y+ph-4+waddleL,16,5);      // sole
  f('#f8f8f8',rx,y+ph-10+waddleR,16,10); // right shoe
  f('#e03020',rx+1,y+ph-8+waddleR,12,3);
  f('#ccc',rx,y+ph-4+waddleR,16,5);
  // Short stub legs
  f('#c8a060',lx+3,y+ph-22+waddleL,9,14);
  f('#c8a060',rx+3,y+ph-22+waddleR,9,14);

  // ── BOTTLE BODY — the main silhouette ──
  // Cream/off-white bottle (coquito is milky white)
  var bcx=x+pw/2, bcy=y+ph*.15, bw=44, bh=54;
  // Main bottle shape — slightly rounded rectangle
  cx.fillStyle='#f5f0e0';
  cx.beginPath();
  cx.moveTo(bcx-bw/2+5,bcy);
  cx.arcTo(bcx+bw/2,bcy,bcx+bw/2,bcy+bh,8);
  cx.arcTo(bcx+bw/2,bcy+bh,bcx-bw/2,bcy+bh,8);
  cx.arcTo(bcx-bw/2,bcy+bh,bcx-bw/2,bcy,8);
  cx.arcTo(bcx-bw/2,bcy,bcx+bw/2,bcy,8);
  cx.closePath();cx.fill();
  // Bottle shading — left and right edges darker
  cx.globalAlpha=.18;f('#8a8060',bcx-bw/2,bcy+4,8,bh-8);
  cx.globalAlpha=.12;f('#8a8060',bcx+bw/2-8,bcy+4,8,bh-8);
  cx.globalAlpha=1;
  // Bottle outline
  cx.strokeStyle='#c8b888';cx.lineWidth=2;
  cx.beginPath();
  cx.moveTo(bcx-bw/2+5,bcy);
  cx.arcTo(bcx+bw/2,bcy,bcx+bw/2,bcy+bh,8);
  cx.arcTo(bcx+bw/2,bcy+bh,bcx-bw/2,bcy+bh,8);
  cx.arcTo(bcx-bw/2,bcy+bh,bcx-bw/2,bcy,8);
  cx.arcTo(bcx-bw/2,bcy,bcx+bw/2,bcy,8);
  cx.closePath();cx.stroke();

  // ── NECK of bottle (narrowing at top) ──
  f('#f0ead8',bcx-10,bcy-12,20,14);
  cx.strokeStyle='#c8b888';cx.lineWidth=1.5;cx.strokeRect(bcx-10,bcy-12,20,14);
  // Slight taper visual
  f('#e8e0c8',bcx-8,bcy-11,16,12);

  // ── BOYA LABEL — centre of bottle, Goya-inspired design ──
  // Label background — cream with red/green border
  var lx2=bcx-18, ly=bcy+10, lw=36, lh=30;
  f('#faf8f0',lx2,ly,lw,lh);           // label bg
  f('#e03020',lx2,ly,lw,4);            // red top stripe
  f('#20a840',lx2,ly+lh-4,lw,4);       // green bottom stripe
  // Inner border
  cx.strokeStyle='#20a840';cx.lineWidth=1;cx.strokeRect(lx2+2,ly+5,lw-4,lh-10);
  // "Boya" text — big, bold, in Goya font spirit
  cx.fillStyle='#101010';cx.font='bold 9px "Press Start 2P"';cx.textAlign='center';
  cx.fillText('BOYA',bcx,ly+17);
  // Tagline below brand name
  cx.fillStyle='#20a840';cx.font='3px "Press Start 2P"';
  cx.fillText('DE PUERTO RICO',bcx,ly+24);
  // Small coconut icon on label
  cx.fillStyle='#8B5E3C';cx.beginPath();cx.arc(bcx-10,ly+20,4,0,Math.PI*2);cx.fill();
  cx.fillStyle='#6B3A1E';cx.beginPath();cx.arc(bcx+10,ly+20,4,0,Math.PI*2);cx.fill();
  cx.fillStyle='#20a840';cx.font='5px monospace';cx.fillText('🥥',bcx,ly+23);
  cx.textAlign='left';

  // ── LITTLE ARMS poking out sides of the bottle ──
  var sw=Math.sin(fr*.2)*4;
  // Left arm
  f('#c8a060',x+2,y+ph*.35+sw,10,8);   // upper arm stub
  f('#c8a060',x,y+ph*.42+sw,10,10);    // hand
  if(grab){
    // Grab — arms stretch forward
    f('#c8a060',x+pw-10,y+ph*.28,10,8);

  } else {
    f('#c8a060',x+pw-12,y+ph*.35-sw,10,8);
    f('#c8a060',x+pw-10,y+ph*.42-sw,10,10);
  }

  // ── CAP — screw cap on top of bottle = hat ──
  // The cap is the character's "head"
  f('#20a840',bcx-12,bcy-22,24,12);    // cap body (green cap)
  f('#18902e',bcx-12,bcy-22,24,4);     // cap top ridge
  f('#20a840',bcx-10,bcy-22,20,12);    // cap main
  // Cap ridges (screw thread detail)
  for(var ri=0;ri<3;ri++){
    cx.globalAlpha=.35;f('#fff',bcx-11,bcy-22+ri*3+1,22,1);cx.globalAlpha=1;
  }
  // Tiny FACE peeking out just below the cap
  // (character's actual face, tiny, in the neck area)
  f('#c8a060',bcx-8,bcy-12,16,14);     // face in neck
  // Eyes — wide and expressive (goofy surprised look)
  f('#fff',bcx-6,bcy-9,5,4);f('#fff',bcx+1,bcy-9,5,4);
  f('#101010',bcx-5,bcy-8,3,3);f('#101010',bcx+2,bcy-8,3,3);
  f('#fff',bcx-4,bcy-8,1,1);f('#fff',bcx+3,bcy-8,1,1); // shine
  // Raised eyebrows (permanently surprised to be in a bottle)
  f('#80603a',bcx-6,bcy-11,5,2);f('#80603a',bcx+1,bcy-11,5,2);
  // Open mouth (goofy grin)
  f('#101010',bcx-4,bcy-4,8,3);f('#e04040',bcx-3,bcy-3,6,2);

  // ── Coquito splashes when turbo ──
  if(turbo){
    cx.globalAlpha=.7+Math.sin(fr*.15)*.2;
    cx.fillStyle='#f5f0e0';cx.font='10px monospace';cx.textAlign='center';
    cx.fillText('💦',x+pw+6,y+8+Math.sin(fr*.12)*4);
    cx.fillText('🥥',x-14,y+12+Math.sin(fr*.1+1)*4);
    cx.globalAlpha=1;cx.textAlign='left';
  }
}

function generateLights() {
  const colors = ['#ff0040', '#ffdd00', '#00e5ff', '#ff1493', '#00ff00'];
  let html = '';
  for (let i = 0; i < 8; i++) {
    const left = 10 + i * 12;
    const color = colors[i % colors.length];
    const delay = i * 0.3;
    html += `<div class="light-bulb" style="left: ${left}%; background: ${color}; animation-delay: ${delay}s;"></div>`;
  }
  return html;
}

function generateCityscape() {
  let html = '';
  const buildings = [
    { left: '5%', width: '80px', height: '80px' },
    { left: '25%', width: '60px', height: '100px' },
    { left: '45%', width: '50px', height: '70px' },
    { right: '20%', width: '70px', height: '90px' },
    { right: '5%', width: '85px', height: '75px' }
  ];
  
  buildings.forEach((b, i) => {
    const style = b.left ? `left: ${b.left}` : `right: ${b.right}`;
    html += `<div class="building building-${i+1}" style="${style}; width: ${b.width}; height: ${b.height};">`;
    
    // Add windows
    const rows = Math.floor(parseInt(b.height) / 20);
    const cols = Math.floor(parseInt(b.width) / 20);
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        if (Math.random() > 0.4) {
          html += `<div class="window" style="top: ${r*15+5}px; left: ${c*18+6}px;"></div>`;
        }
      }
    }
    
    html += `</div>`;
  });
  
  return html;
}

function renderDots() {
  const dotsContainer = document.getElementById('carouselDots');
  dotsContainer.innerHTML = games.map((_, i) => 
    `<div class="dot ${i === 0 ? 'active' : ''}" onclick="goToSlide(${i})"></div>`
  ).join('');
}

// ═══════════════════════════════════════════════
//  NAVIGATION
// ═══════════════════════════════════════════════

function showPoster(index) {
  const posters = document.querySelectorAll('.arcade-poster');
  const dots = document.querySelectorAll('.dot');

  posters.forEach((p, i) => {
    if (i === index) {
      p.classList.remove('active');
      void p.offsetWidth; // force reflow so animation restarts
      p.classList.add('active');
    } else {
      p.classList.remove('active');
    }
  });

  dots.forEach((d, i) => {
    d.classList.toggle('active', i === index);
  });

  currentIndex = index;
}

function nextPoster() {
  const next = (currentIndex + 1) % games.length;
  showPoster(next);
}

function prevPoster() {
  const prev = (currentIndex - 1 + games.length) % games.length;
  showPoster(prev);
}

function goToSlide(index) {
  showPoster(index);
}



// ═══════════════════════════════════════════════
//  TOUCH/SWIPE SUPPORT
// ═══════════════════════════════════════════════

let touchStartX = 0;
let touchEndX = 0;

document.addEventListener('touchstart', e => {
  touchStartX = e.changedTouches[0].screenX;
});

document.addEventListener('touchend', e => {
  touchEndX = e.changedTouches[0].screenX;
  handleSwipe();
});

function handleSwipe() {
  const diff = touchStartX - touchEndX;
  if (Math.abs(diff) > 50) {
    if (diff > 0) {
      nextPoster();
    } else {
      prevPoster();
    }
  }
}

// Keyboard navigation
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') prevPoster();
  if (e.key === 'ArrowRight') nextPoster();
  if (e.key === 'Escape') goBack();
});

function backToArcade() {
  if (typeof gameoverTO !== 'undefined' && gameoverTO) {
    clearTimeout(gameoverTO); gameoverTO = null;
  }
  if (raf) { cancelAnimationFrame(raf); raf = null; }
  stopMusic();
  hideGameOver();
  hidePauseMenu();
  document.getElementById('hud').style.display = 'none';
  showArcade();
}

// ── Initialise arcade on page load ──
createStarfield();
renderPosters();
showArcade();
