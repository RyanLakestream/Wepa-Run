<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="¡Wepa Run!">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>¡Wepa Run!</title>
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" crossorigin>
<style>
/* Press Start 2P loaded via <link> in <head> — see preconnect tags */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;}
html,body{width:100%;height:100dvh;height:100vh;overflow:hidden;background:#000;touch-action:none;}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Press Start 2P',monospace;position:fixed;top:0;left:0;right:0;bottom:0;background:#000;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom) 0;}
#wrap{position:relative;width:100%;touch-action:none;margin:0 auto;background:#000;}
canvas{display:block;width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;-webkit-tap-highlight-color:transparent;}

/* ── HUD ── */
#hud{position:absolute;top:0;left:0;right:0;height:44px;min-height:44px;background:#000;border-bottom:2px solid #fff;display:none;align-items:center;padding:0 8px;gap:4px;z-index:10;}
.hl{font-size:6px;color:#fff;pointer-events:none;}
.bb{height:10px;background:#111;border:1px solid #fff;pointer-events:none;}
#eb{width:72px;}#fb{width:52px;}
.bf{height:100%;pointer-events:none;}
#ef{background:#20c030;}#ff2{background:#9820c8;}
#scorehud{font-size:7px;color:#fff;letter-spacing:1px;margin-left:6px;pointer-events:none;}
.hico{font-size:12px;line-height:1;pointer-events:none;}
#flanct{font-size:6px;color:#f8d020;min-width:24px;pointer-events:none;}
#coinhud{font-size:6px;color:#f8d020;margin-left:4px;white-space:nowrap;pointer-events:none;}

/* Pause button — lives in HUD */
#pauseBtn{
  margin-left:auto;
  width:32px;height:32px;
  background:#111;
  border:2px solid #f8d020;
  color:#f8d020;
  font-size:14px;
  line-height:28px;
  text-align:center;
  cursor:pointer;
  flex-shrink:0;
  border-radius:2px;
  transition:background .1s;
  display:flex;align-items:center;justify-content:center;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
#pauseBtn:active{background:#f8d020;color:#000;}
#soundBtn{
  width:32px;height:32px;
  background:#111;
  border:2px solid #f8d020;
  color:#f8d020;
  font-size:14px;
  cursor:pointer;
  flex-shrink:0;
  border-radius:2px;
  display:flex;align-items:center;justify-content:center;
  margin-left:4px;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
#soundBtn:active{background:#f8d020;color:#000;}

/* ── POPUPS ── */
#popup{position:absolute;left:50%;transform:translateX(-50%);top:52px;pointer-events:none;z-index:20;display:none;white-space:nowrap;}
.ptxt{font-size:13px;color:#f8d020;text-shadow:2px 2px #000,-2px -2px #000,2px -2px #000,-2px 2px #000;animation:pu .6s ease-out forwards;}
@keyframes pu{0%{opacity:1;transform:scale(.3) translateY(0)}50%{transform:scale(1.25) translateY(-14px)}100%{opacity:0;transform:scale(1) translateY(-38px)}}
#pban{position:absolute;left:0;right:0;top:46px;pointer-events:none;z-index:20;display:none;text-align:center;padding:5px 0;background:rgba(0,0,0,.85);border-top:2px solid #f8d020;border-bottom:2px solid #f8d020;}
#pban .b1{font-size:10px;color:#f8d020;}
#pban .b2{font-size:6px;color:#fff;margin-top:3px;}

/* ── GAME OVER OVERLAY ── */
#GS{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:30;background:rgba(0,0,0,.93);}
#GS .go-title{font-size:22px;color:#e03020;text-shadow:3px 3px #000;margin-bottom:14px;letter-spacing:1px;}
#GS .go-stats{font-size:9px;color:#fff;line-height:2.6;margin-bottom:6px;}
#GS #coinTotal{font-size:8px;color:#f0b020;margin-bottom:6px;font-weight:bold;}
#GS .go-best{font-size:9px;color:#f8d020;margin-bottom:8px;}
#newHSBanner{display:none;font-size:9px;color:#f8d020;text-shadow:2px 2px #000;margin-bottom:12px;animation:nhsPulse 0.6s step-end infinite;}
@keyframes nhsPulse{0%,100%{opacity:1;color:#f8d020;}50%{opacity:.4;color:#fff;}}

/* ── PIXEL BUTTON style — used in overlays ── */
.px-btn{
  display:block;
  font-family:'Press Start 2P',monospace;
  font-size:9px;
  color:#000;
  background:#f8d020;
  border:none;
  padding:14px 28px;
  margin:8px auto 0;
  cursor:pointer;
  letter-spacing:.5px;
  box-shadow:4px 4px 0 #a08000, -1px -1px 0 #fff8;
  transition:transform .08s,box-shadow .08s;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
  min-width:180px;text-align:center;
  -webkit-appearance:none;
  appearance:none;
}
.px-btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 #a08000;}
.px-btn.red{background:#e03020;color:#fff;box-shadow:4px 4px 0 #800;--shadow:#800;}
.px-btn.red:active{transform:translate(2px,2px);box-shadow:2px 2px 0 #800;}
.px-btn.green{background:#20c060;color:#fff;box-shadow:4px 4px 0 #0a5020;}
.px-btn.green:active{transform:translate(2px,2px);box-shadow:2px 2px 0 #0a5020;}
.px-btn.ghost{background:transparent;color:#f8d020;border:2px solid #f8d020;box-shadow:none;font-size:7px;padding:10px 20px;}
.px-btn.ghost:active{background:#f8d020;color:#000;}
#shareBtn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 #0a4a99;}

/* Blink for start prompts */
.ps{font-size:7px;color:#f8d020;animation:bl .9s step-end infinite;margin-top:14px;cursor:pointer;}
@keyframes bl{50%{opacity:0}}

/* Safe area already applied on body above */

/* ═══════════════════════════════════════════════════════════════════
   ARCADE SCREEN OVERLAY STYLES
   ═══════════════════════════════════════════════════════════════════ */

/* Full-viewport overlay that sits above the game while visible */
#arcadeScreen {
  position: fixed;
  inset: 0;
  z-index: 500;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  display: none;
}

/* ═══════════════════════════════════════════════
   ARCADE POSTER TEASER SYSTEM
   Matches reference poster style exactly
   ═══════════════════════════════════════════════ */

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

:root {
  /* Puerto Rico night plaza palette (from reference) */
  --deep-night: #0a0515;
  --purple-sky: #1a0a2e;
  --purple-mid: #2a1a4e;
  --neon-pink: #ff1493;
  --neon-cyan: #00e5ff;
  --hot-pink: #ff69b4;
  --bright-yellow: #ffdd00;
  --gold: #ffd700;
  --white: #ffffff;
  --red-accent: #ff0040;
  
  /* Poster structure */
  --poster-max-width: 420px;
  --border-thick: 4px;
  --border-thin: 2px;
  --glow-pink: 0 0 20px rgba(255, 20, 147, 0.6), 0 0 40px rgba(255, 20, 147, 0.3);
  --glow-cyan: 0 0 20px rgba(0, 229, 255, 0.6), 0 0 40px rgba(0, 229, 255, 0.3);
  --glow-gold: 0 0 15px rgba(255, 221, 0, 0.5);
}


/* ═══ ANIMATED BACKGROUND ═══ */
#starfield {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  background: linear-gradient(180deg, var(--deep-night) 0%, var(--purple-sky) 50%, var(--purple-mid) 100%);
}

.star {
  position: absolute;
  width: 2px;
  height: 2px;
  background: var(--white);
  border-radius: 50%;
  animation: twinkle 3s infinite;
}

@keyframes twinkle {
  0%, 100% { opacity: 0.3; }
  50% { opacity: 1; }
}

/* ═══ CAROUSEL CONTAINER ═══ */
#teaserCarousel {
  position: relative;
  z-index: 1;
  width: 100%;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  overflow: hidden;
}

.poster-wrapper {
  width: 100%;
  max-width: var(--poster-max-width);
  position: relative;
}

/* ═══ ARCADE POSTER STRUCTURE ═══ */
.arcade-poster {
  background: var(--deep-night);
  border: var(--border-thick) solid var(--neon-pink);
  box-shadow: var(--glow-pink), inset 0 0 40px rgba(255, 20, 147, 0.1);
  border-radius: 12px;
  overflow: hidden;
  position: relative;
}

@keyframes posterFadeIn {
  from {
    opacity: 0;
    transform: scale(0.95) translateY(20px);
  }
  to {
    opacity: 1;
    transform: scale(1) translateY(0);
  }
}

/* Corner decorations (like reference) */
.arcade-poster::before,
.arcade-poster::after {
  content: '★';
  position: absolute;
  top: 12px;
  font-size: 16px;
  color: var(--neon-cyan);
  text-shadow: var(--glow-cyan);
  z-index: 10;
  animation: spin 4s linear infinite;
}

.arcade-poster::before {
  left: 12px;
}

.arcade-poster::after {
  right: 12px;
}

@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

/* Crescent moon (top centre, avoids overlap with corner stars) */
.moon {
  position: absolute;
  top: 15px;
  left: 50%;
  transform: translateX(-50%);
  width: 40px;
  height: 40px;
  background: var(--gold);
  border-radius: 50%;
  box-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
  z-index: 10;
  clip-path: ellipse(60% 100% at 70% 50%);
}

/* ═══ MARQUEE TITLE (giant block header) ═══ */
.poster-header {
  background: var(--purple-sky);
  padding: 30px 20px 25px;
  text-align: center;
  position: relative;
  border-bottom: var(--border-thick) solid var(--neon-pink);
}

.poster-title {
  font-size: clamp(20px, 6vw, 28px);
  line-height: 1.2;
  letter-spacing: -1px;
  text-transform: uppercase;
  margin: 0;
  position: relative;
  z-index: 2;
}

.title-accent {
  color: var(--bright-yellow);
  text-shadow: var(--glow-gold);
}

.title-main {
  color: var(--white);
  display: block;
  margin-top: 8px;
}

.title-subtext {
  color: var(--hot-pink);
  display: block;
  margin-top: 8px;
}

/* ═══ SUBTITLE STRIP (bordered neon) ═══ */
.poster-subtitle {
  background: var(--neon-cyan);
  color: var(--deep-night);
  font-size: clamp(7px, 2.2vw, 9px);
  padding: 8px 15px;
  text-align: center;
  letter-spacing: 0.5px;
  font-weight: bold;
  text-transform: uppercase;
  border-top: var(--border-thin) solid var(--white);
  border-bottom: var(--border-thin) solid var(--white);
}

/* ═══ HERO SCENE (central poster art) ═══ */
.poster-hero {
  height: 320px;
  background: var(--purple-mid);
  position: relative;
  overflow: hidden;
  border-bottom: var(--border-thick) solid var(--neon-pink);
}

/* Cityscape silhouette */
.cityscape {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 40%;
  background: linear-gradient(180deg, transparent 0%, var(--deep-night) 60%);
  z-index: 1;
}

.building {
  position: absolute;
  bottom: 0;
  background: var(--deep-night);
}

.building-1 { left: 5%; width: 80px; height: 80px; }
.building-2 { left: 25%; width: 60px; height: 100px; }
.building-3 { left: 45%; width: 50px; height: 70px; }
.building-4 { right: 20%; width: 70px; height: 90px; }
.building-5 { right: 5%; width: 85px; height: 75px; }

/* Window lights */
.window {
  position: absolute;
  width: 4px;
  height: 6px;
  background: var(--bright-yellow);
  box-shadow: 0 0 8px rgba(255, 221, 0, 0.6);
}

/* String lights (festive plaza vibe) */
.string-lights {
  position: absolute;
  top: 60px;
  left: 0;
  width: 100%;
  height: 2px;
  z-index: 3;
}

.light-bulb {
  position: absolute;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  animation: bulbGlow 2s infinite;
}

@keyframes bulbGlow {
  0%, 100% { opacity: 0.6; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.2); }
}

/* Character placeholder (will be customized per game) */
.hero-character {
  position: absolute;
  bottom: 15%;
  left: 50%;
  transform: translateX(-50%);
  font-size: 80px;
  z-index: 2;
  filter: drop-shadow(0 5px 10px rgba(0, 0, 0, 0.5));
}

/* ═══ FEATURE PANELS (4-grid beneath hero) ═══ */
.poster-features {
  display: grid;
  grid-template-columns: 1fr 1fr;
  background: var(--deep-night);
  border-bottom: var(--border-thick) solid var(--neon-pink);
}

.feature-item {
  padding: 18px 12px;
  text-align: center;
  border: var(--border-thin) solid var(--neon-pink);
  background: rgba(255, 20, 147, 0.05);
  transition: all 0.3s;
}

.feature-item:hover {
  background: rgba(255, 20, 147, 0.15);
  transform: scale(1.05);
}

.feature-icon {
  font-size: 28px;
  margin-bottom: 8px;
  display: block;
  filter: drop-shadow(0 0 10px currentColor);
}

.feature-label {
  font-size: clamp(7px, 2vw, 9px);
  color: var(--bright-yellow);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  line-height: 1.4;
}

/* ═══ CTA BAR (large arcade button) ═══ */
.poster-cta {
  background: var(--neon-cyan);
  padding: 22px 20px;
  text-align: center;
  position: relative;
  border-bottom: var(--border-thick) solid var(--neon-pink);
}

.cta-arrow {
  font-size: 16px;
  color: var(--red-accent);
  animation: arrowBounce 1.5s infinite;
  display: inline-block;
  margin: 0 8px;
}

@keyframes arrowBounce {
  0%, 100% { transform: translateX(0); }
  50% { transform: translateX(5px); }
}

.cta-main {
  font-size: clamp(10px, 3vw, 13px);
  color: var(--deep-night);
  font-weight: bold;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin: 5px 0;
}

.cta-sub {
  font-size: clamp(6px, 1.8vw, 7px);
  color: rgba(10, 5, 21, 0.7);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

/* ═══ COMING SOON BANNER (gold marquee) ═══ */
.poster-banner {
  background: var(--gold);
  color: var(--deep-night);
  padding: 15px 20px;
  text-align: center;
  border: var(--border-thick) solid var(--bright-yellow);
  box-shadow: inset 0 0 20px rgba(255, 221, 0, 0.3);
  position: relative;
}

.banner-star {
  font-size: 18px;
  color: var(--red-accent);
  display: inline-block;
  margin: 0 12px;
  animation: spin 3s linear infinite;
}

.banner-text {
  font-size: clamp(12px, 3.5vw, 16px);
  font-weight: bold;
  letter-spacing: 2px;
}

/* ═══ FOOTER TAGLINE (tiny pixel copy) ═══ */
.poster-footer {
  padding: 12px 15px;
  text-align: center;
  background: var(--deep-night);
}

.footer-dots {
  font-size: 8px;
  margin: 0 4px;
  opacity: 0.6;
}

.footer-text {
  font-size: clamp(6px, 1.6vw, 7px);
  color: var(--hot-pink);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  line-height: 1.6;
}

/* ═══ NAVIGATION ═══ */
.nav-controls {
  position: fixed;
  top: 20px;
  left: 20px;
  z-index: 100;
}

.nav-btn {
  background: var(--neon-pink);
  color: var(--white);
  border: var(--border-thin) solid var(--white);
  padding: 10px 18px;
  font-family: 'Press Start 2P', monospace;
  font-size: 10px;
  text-transform: uppercase;
  cursor: pointer;
  box-shadow: var(--glow-pink);
  border-radius: 6px;
  transition: all 0.3s;
}

.nav-btn:hover {
  background: var(--hot-pink);
  transform: scale(1.05);
}

.carousel-arrows {
  position: fixed;
  bottom: 40px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 20px;
  z-index: 100;
}

.arrow-btn {
  width: 50px;
  height: 50px;
  background: var(--neon-cyan);
  border: var(--border-thin) solid var(--white);
  border-radius: 50%;
  font-size: 20px;
  color: var(--deep-night);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: var(--glow-cyan);
  transition: all 0.3s;
}

.arrow-btn:hover {
  transform: scale(1.1);
}

.arrow-btn:active {
  transform: scale(0.95);
}

/* Dot indicators */
.carousel-dots {
  position: fixed;
  bottom: 110px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 12px;
  z-index: 100;
}

.dot {
  width: 10px;
  height: 10px;
  background: rgba(255, 255, 255, 0.3);
  border: 1px solid var(--white);
  border-radius: 50%;
  cursor: pointer;
  transition: all 0.3s;
}

.dot.active {
  background: var(--neon-pink);
  box-shadow: var(--glow-pink);
  transform: scale(1.3);
}

/* ═══ RESPONSIVE ═══ */
@media (max-width: 480px) {
  .poster-hero {
    height: 280px;
  }
  
  .nav-controls {
    top: 10px;
    left: 10px;
  }
  
  .nav-btn {
    padding: 8px 14px;
    font-size: 8px;
  }
}

@media (min-width: 768px) {
  #teaserCarousel {
    padding: 40px;
  }
}

/* Hide inactive posters */
.arcade-poster {
  display: none;
}

.arcade-poster.active {
  display: block;
  animation: posterFadeIn 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
}
</style>
</head>
<body>

<!-- ═══ ARCADE OVERLAY (shown on load) ═══ -->
<div id="arcadeScreen">
<!-- Animated starfield background -->
<div id="arcade-starfield"></div>

<!-- Carousel container -->
<div id="teaserCarousel">
  <div class="poster-wrapper">
    <!-- Posters will be injected here -->
  </div>
</div>

<!-- Carousel controls -->
<div class="carousel-arrows">
  <button class="arrow-btn" onclick="prevPoster()">◄</button>
  <button class="arrow-btn" onclick="nextPoster()">►</button>
</div>

<div class="carousel-dots" id="carouselDots"></div>
</div>

<!-- ═══ GAME (shown after PLAY NOW) ═══ -->
<div id="wrap">
  <canvas id="c" width="480" height="620"></canvas>

  <!-- ── HUD (shown during gameplay) ── -->
  <div id="hud">
    <span class="hico">❤️</span>
    <div class="bb" id="eb"><div class="bf" id="ef" style="width:100%"></div></div>
    <span class="hico">🍮</span>
    <div id="flanct">x0</div>
    <span class="hico">🫧</span>
    <div class="bb" id="fb"><div class="bf" id="ff2" style="width:0%"></div></div>
    <div id="scorehud">0m</div>
    <div id="coinhud">🪙0</div>
    <button id="pauseBtn" aria-label="Pause">⏸</button>
    <button id="soundBtn" aria-label="Toggle sound">🔊</button>
  </div>

  <!-- ── GAME OVER ── -->
  <div id="GS">
    <div style="text-align:center;padding:0 20px;">
      <div class="go-title">GAME OVER</div>
      <div id="newHSBanner">★ NEW HIGH SCORE! ★</div>
      <div class="go-stats">DISTANCE: <span id="gsc">0</span>m &nbsp;|&nbsp; FLANS: <span id="gfl">0</span></div>
      <div class="go-best">🏆 BEST: <span id="gbe">0</span>m</div>
      <div id="coinEarned" style="font-size:8px;color:#f0b020;margin:8px 0 2px;text-shadow:1px 1px #000;">🍮 <span id="gce">+0</span> FLANS THIS RUN</div>
      <div id="coinTotal" style="font-size:7px;color:#aaa;margin-bottom:6px;"><span id="gct">TOTAL FLANS: 0 🍮</span></div>
      <div id="goNearMiss" style="display:none;font-size:7px;font-family:'Press Start 2P',monospace;margin-bottom:8px;padding:6px 10px;background:rgba(248,208,32,0.12);border:1px solid #f8d020;border-radius:2px;"></div>
      <button class="px-btn" id="shareBtn" style="background:#1d8cf8;color:#fff;box-shadow:4px 4px 0 #0a4a99;margin-bottom:2px;">📤 SHARE SCORE</button>

// ═══════════════════════════════════════════════
//  SOUND SYSTEM
//  Signal chain: oscillators/sfx → masterGain → AC.destination
//  Music-specific chain: oscillators → musicGain → masterGain → AC.destination
//  • masterGain controls overall mute (gain=0 silences everything instantly)
//  • musicGain controls music-only fade so SFX play through transitions
//  • musicTimeout = the pending setTimeout for the next loop iteration
//  • stopMusic() kills the scheduler AND ramps musicGain to 0 — silences
//    all already-queued oscillator nodes without needing to track each one
//  • startMusicForPhase(p) encodes the per-screen music policy:
//      'title' | 'charselect' → TRACK_MENU (salsa, gentle)
//      'playing'              → currentTrack (random, picked at run start)
//      everything else        → silence
// ═══════════════════════════════════════════════
var SOUND_KEY = 'flanManAlejoSound';
var soundOn = (function(){
  try { var v = localStorage.getItem(SOUND_KEY); return v === null ? true : v === '1'; }
  catch(e){ return true; }
})();

var AC = null;          // AudioContext — created on first user gesture
var masterGain = null;  // All audio (sfx + music) routes through this
var musicGain  = null;  // Music-only gain — lets us fade music without affecting sfx
var mNs = [];           // Active oscillator nodes (pruned periodically)
var musicTimeout = null;// setTimeout handle for the music loop scheduler
var _musicPhase = null; // Which phase the music was last started for
var _musicTrack = -1;  // Which track index is currently playing (-1 = none)

// ── Boot AudioContext on first user interaction (required on iOS/Android) ──
function initAC(){
  if(AC){ resumeAC(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = AC.createGain();
    masterGain.gain.value = soundOn ? 1 : 0;
    masterGain.connect(AC.destination);
    // musicGain sits between music oscillators and masterGain
    musicGain = AC.createGain();
    musicGain.gain.value = 1;
    musicGain.connect(masterGain);
    resumeAC();
    // Don't start music here — caller (phase transition) decides what to play
  } catch(e){ AC = null; }
}

// iOS Safari suspends AudioContext until a gesture — always resume defensively
function resumeAC(){
  if(AC && AC.state === 'suspended'){
    AC.resume().catch(function(){});
  }
}

// ── Stop music completely — hard-stops all queued nodes AND kills scheduler ──
function stopMusic(){
  // 1. Cancel the pending loop reschedule
  if(musicTimeout){ clearTimeout(musicTimeout); musicTimeout = null; }
  // 2. Hard-stop every tracked oscillator/buffer node
  //    This prevents old pre-queued notes from bleeding into new tracks
  var t0 = AC ? AC.currentTime + 0.01 : 0;
  for(var _i=0; _i<mNs.length; _i++){
    try{
      if(mNs[_i].stop) mNs[_i].stop(t0);
      if(mNs[_i].disconnect) mNs[_i].disconnect();
    }catch(_e){}
  }
  mNs = [];
  // 3. Silence musicGain immediately
  if(musicGain && AC){
    var now = AC.currentTime;
    musicGain.gain.cancelScheduledValues(now);
    musicGain.gain.setValueAtTime(0, now);
  }
  _musicPhase = null;
  _musicTrack = -1;
}

// ── Start the right music for a given phase — no-op if already playing it ──
// Call this on every phase transition. Pass the new phase string.
function startMusicForPhase(newPhase){
  if(!AC || !soundOn) return;
  resumeAC();

  // Policy: which track index to play per phase
  // placita uses a sentinel index (99) so it won't no-op against game tracks
  var schedTrack;
  if(newPhase === 'title' || newPhase === 'charselect'){
    schedTrack = 0; // Always salsa on menu screens — familiar, welcoming
  } else if(newPhase === 'playing'){
    schedTrack = currentTrack; // Random track already set by pickRandomTrack()
  } else if(newPhase === 'placita'){
    schedTrack = 99; // Sentinel — La Placita has its own track (TRACK_PLACITA)
  } else {
    // 'ad', 'paused', 'gameover' — silence
    stopMusic();
    return;
  }

  // No-op: this exact track is already playing with a live scheduler.
  if(_musicTrack === schedTrack && (_musicPhase !== null || musicTimeout !== null)) return;

  // Stop whatever is playing and start the new track immediately
  stopMusic();
  if(!soundOn || !AC || !musicGain) return;
  var now = AC.currentTime;
  musicGain.gain.cancelScheduledValues(now);
  musicGain.gain.setValueAtTime(0, now);
  musicGain.gain.linearRampToValueAtTime(1, now + 0.04);
  currentTrack = schedTrack === 99 ? currentTrack : schedTrack;
  _musicPhase = newPhase;
  _musicTrack = schedTrack;
  scheduleMusic();
}

// ── Master volume toggle ──
function toggleSound(){
  soundOn = !soundOn;
  try { localStorage.setItem(SOUND_KEY, soundOn ? '1' : '0'); } catch(e){}
  if(masterGain) masterGain.gain.value = soundOn ? 1 : 0;
  if(soundOn){
    if(!AC){ initAC(); }
    else { resumeAC(); }
    // startMusicForPhase handles musicGain restore and scheduling
    if(phase) startMusicForPhase(phase);
  } else {
    stopMusic();
  }
  updateSoundBtn();
}
function updateSoundBtn(){
  var btn = document.getElementById('soundBtn');
  if(btn) btn.textContent = soundOn ? '🔊' : '🔇';
}

// ═══════════════════════════════════════════════
//  MUSIC SYSTEM — 4 randomized 8-bit Caribbean tracks
//  Each track is pure note/rhythm data; all share mkO/mkD primitives.
//  currentTrack is picked per-run in startGame().
//  scheduleMusic() loops the selected track cleanly forever.
// ═══════════════════════════════════════════════

var currentTrack = 0; // 0=Salsa 1=Merengue 2=Bachata 3=Reggaeton

// ── Shared oscillator note primitive — routes through musicGain ──
function mkO(fq, s, d, tp, v){
  if(!AC || !musicGain) return;
  tp = tp || 'square'; v = v || 0.065;
  var o = AC.createOscillator(), g = AC.createGain();
  o.type = tp; o.frequency.value = fq;
  var t = AC.currentTime + s;
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(v, t + 0.008);
  g.gain.linearRampToValueAtTime(0, t + d - 0.008);
  o.connect(g); g.connect(musicGain);
  o.start(t); o.stop(t + d);
  o._stopAt = t + d;
  mNs.push(o);
}

// ── Shared drum primitive (kick / snare / hat / clave) — routes through musicGain ──
function mkD(t, tp){
  if(!AC || !musicGain) return;
  var t0 = AC.currentTime + t;
  if(tp === 'hat'){
    var sz = AC.sampleRate * 0.025;
    var buf = AC.createBuffer(1, sz, AC.sampleRate);
    var da = buf.getChannelData(0);
    for(var i = 0; i < sz; i++) da[i] = Math.random() * 2 - 1;
    var s = AC.createBufferSource(), g = AC.createGain(), fi = AC.createBiquadFilter();
    fi.type = 'highpass'; fi.frequency.value = 7000;
    g.gain.setValueAtTime(0.045, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.022);
    s.buffer = buf; s.connect(fi); fi.connect(g); g.connect(musicGain);
    s.start(t0); s.stop(t0 + 0.03);
    return;
  }
  if(tp === 'clave'){
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = 'square'; o.frequency.value = 950;
    g.gain.setValueAtTime(0.11, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.055);
    o.connect(g); g.connect(musicGain); o.start(t0); o.stop(t0 + 0.065);
    o._stopAt = t0 + 0.065;
    mNs.push(o); return;
  }
  var o = AC.createOscillator(), g = AC.createGain();
  if(tp === 'kick'){
    o.frequency.setValueAtTime(180, t0); o.frequency.exponentialRampToValueAtTime(35, t0 + 0.12);
    g.gain.setValueAtTime(0.42, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.18);
  } else { // snare
    o.type = 'sawtooth'; o.frequency.value = 145;
    g.gain.setValueAtTime(0.14, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.08);
  }
  o.connect(g); g.connect(musicGain); o.start(t0); o.stop(t0 + 0.2);
  o._stopAt = t0 + 0.2;
  mNs.push(o);
}

// ── Shared note frequency table ──
var NN={
  // Octave 3
  C3:130.8, D3:146.8, Eb3:155.6, F3:174.6, G3:196.0, Ab3:207.7, A3:220.0, Bb3:233.1,
  // Octave 4

      mkO(ch*1.25,t+BT*2.75,.07,'sawtooth',0.032); // stacked interval for thickness
    }

    // ── Sub-bass — punchy, low triangle, dembow groove ──
    // Alternates root (G3) and fifth (D4) with pickup notes
    var bassMap=[[G3,D4],[G3,A4],[G3,D4],[D4,G3]];
    for(var b=0;b<bars;b++){
      var t=b*BR, bm=bassMap[b%bassMap.length];
      mkO(bm[0], t,         .32,'triangle',0.18); // beat 1
      mkO(bm[1], t+BT*2,    .28,'triangle',0.13); // beat 3
      mkO(bm[0], t+BT*2.5,  .22,'triangle',0.12); // the dembow "and of 3"
      mkO(bm[1], t+BT*3.5,  .18,'triangle',0.10); // pickup to next bar
    }

    // ── Dembow drums — the signature Caribbean rhythmic engine ──
    for(var b=0;b<bars;b++){
      var t=b*BR;
      mkD(t,         'kick');  // beat 1
      mkD(t+BT,      'snare'); // beat 2
      mkD(t+BT*2,    'kick');  // beat 3
      mkD(t+BT*2.5,  'kick');  // the "and" of 3 — THIS IS THE DEMBOW
      mkD(t+BT*3,    'snare'); // beat 4
      // 16th-note hi-hats (tambourine feel — festive)
      for(var h=0;h<16;h++) mkD(t+h*(BT/4),'hat');
      // Extra accent kick every other bar for variation
      if(b%2===1) mkD(t+BT*3.5,'kick');
    }
  }
  return {name:'Placita',schedule:schedule,tot:tot};
})();

// ── Pick a random track for the next run (called from startGame) ──
function pickRandomTrack(){
  currentTrack = Math.floor(Math.random() * TRACKS.length);
}

// ── Core scheduler — loops the current track forever until muted ──
function scheduleMusic(){
  if(!AC || !soundOn || !musicGain) return;
  if(musicTimeout) return;

  // Prune nodes whose scheduled stop time has already passed
  var now2 = AC ? AC.currentTime : 0;
  try{ mNs = mNs.filter(function(o){ return o._stopAt && o._stopAt > now2; }); }catch(e){ mNs=[]; }

  // Pick the right track for the current phase
  var track = (_musicPhase === 'placita') ? TRACK_PLACITA : TRACKS[currentTrack];
  track.schedule();

  // Fire 150ms before the track ends so next batch is pre-queued with zero gap
  musicTimeout = setTimeout(function(){
    musicTimeout = null;
    if(soundOn && (_musicPhase === 'title' || _musicPhase === 'charselect' || _musicPhase === 'playing' || _musicPhase === 'placita')){
      scheduleMusic();
    }
  }, track.tot * 1000 - 150);
}

// ── SOUND EFFECTS — all route through masterGain ──
// sfx() is safe to call even when sound is off (masterGain.gain=0 silences it)
// It still requires AC to be initialized (user gesture happened)
function sfx(type){
  try{
    if(!AC || !masterGain) return;
    resumeAC(); // defensive — iOS may have suspended after inactivity
    var o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
    if(type === 'jump'){
      o.frequency.setValueAtTime(300, t);
      o.frequency.linearRampToValueAtTime(600, t + 0.12);
      g.gain.setValueAtTime(0.16, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
    } else if(type === 'flan'){
      o.type = 'triangle';
      o.frequency.setValueAtTime(500, t);
      o.frequency.linearRampToValueAtTime(900, t + 0.12);
      g.gain.setValueAtTime(0.18, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
    } else if(type === 'bottle'){
      o.frequency.setValueAtTime(400, t);
      o.frequency.linearRampToValueAtTime(200, t + 0.09);
      g.gain.setValueAtTime(0.14, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
    } else if(type === 'hurt'){
      o.type = 'sawtooth';
      o.frequency.value = 140;
      g.gain.setValueAtTime(0.22, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
    } else if(type === 'power'){
      o.frequency.setValueAtTime(200, t);
      o.frequency.exponentialRampToValueAtTime(800, t + 0.3);
      g.gain.setValueAtTime(0.2, t);           // ← was setValueAtValue (typo fixed)
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
    } else if(type === 'select'){
      o.type = 'triangle';
      o.frequency.setValueAtTime(440, t);
      o.frequency.linearRampToValueAtTime(660, t + 0.08);
      g.gain.setValueAtTime(0.12, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
    } else if(type === 'score'){
      // Bright ding for scoring/combo
      o.type = 'triangle';
      o.frequency.setValueAtTime(880, t);
      o.frequency.linearRampToValueAtTime(1320, t + 0.06);
      g.gain.setValueAtTime(0.14, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
    } else { return; }
    o.connect(g); g.connect(masterGain);
    o.start(t); o.stop(t + 0.4);
  } catch(e){}
}

var ALL_CHARACTERS_UNLOCKED = false; // true only for testing

// localStorage keys
var FLAN_KEY     = 'flanManAlejoTotalFlans'; // cumulative flans ever collected

// Characters that are always free
var FREE_IDS = ['alejo','pedro','mariangela','abuela','yanqui'];

// Load cumulative flan count (persists across sessions)
var totalFlansEver = (function(){
  try{ return parseInt(localStorage.getItem(FLAN_KEY)||'0',10)||0; }
  catch(e){ return 0; }
})();

// Load unlocked set — always seeds FREE_IDS so free chars never disappear
var unlockedSet = (function(){
  try{
    var raw = localStorage.getItem(UNLOCKED_KEY);
    var arr = raw ? JSON.parse(raw) : [];
    FREE_IDS.forEach(function(id){ if(arr.indexOf(id)<0) arr.push(id); });
    return arr;
  }catch(e){ return FREE_IDS.slice(); }
})();

// ── isUnlocked: ALL_CHARACTERS_UNLOCKED bypasses all locks ──
function isUnlocked(charId){
  if(ALL_CHARACTERS_UNLOCKED) return true;
  return unlockedSet.indexOf(charId) >= 0;
}

// ── Persist helpers ──
function saveFlans(){
  try{ localStorage.setItem(FLAN_KEY, String(totalFlansEver)); }catch(e){}
}
function saveUnlocked(){
  try{ localStorage.setItem(UNLOCKED_KEY, JSON.stringify(unlockedSet)); }catch(e){}
}

// ── Add flans to cumulative total and check for new unlocks ──
function addFlans(n){
  totalFlansEver += n;
  saveFlans();
  checkFlanUnlocks();
}

// ── Auto-unlock any character whose flan threshold is now met ──
function checkFlanUnlocks(){
  if(ALL_CHARACTERS_UNLOCKED) return;
  var unlocked=false;
  CHARS.forEach(function(ch){
    if(ch.cost>0 && unlockedSet.indexOf(ch.id)<0 && totalFlansEver>=ch.cost){
      unlockedSet.push(ch.id);
      unlocked=true;
      if(phase==='playing'){
        // S5: In-game unlock — fanfare + celebration
        sfxUnlock();
        showPop('\u00a1DESBLOQUEADO! '+ch.name,'#f8d020');
      }
    }
  });
  if(unlocked) saveUnlocked();
}

// ── tryUnlock: kept for charselect tap (free chars instant, locked chars show progress) ──
function tryUnlock(idx){
  if(ALL_CHARACTERS_UNLOCKED){
    // In test mode tapping a locked char just unlocks it for free
    var ch=CHARS[idx];
    if(ch && unlockedSet.indexOf(ch.id)<0){ unlockedSet.push(ch.id); saveUnlocked(); }
    return true;
  }
  var ch=CHARS[idx];
  if(!ch || isUnlocked(ch.id)) return false;
  if(totalFlansEver < ch.cost) return false;
  unlockedSet.push(ch.id);
  saveUnlocked();
  sfx('flan');
  return true;
}

// ── Page Visibility API — stop RAF + music when tab hidden (mobile battery) ──
var _phaseBeforeHide = null;
document.addEventListener('visibilitychange', function(){
  if(document.hidden){
    // Cancel RAF immediately so the loop stops
    if(raf){ cancelAnimationFrame(raf); raf=null; }
    // Silence music cleanly — ramps musicGain to 0 and kills the scheduler
    stopMusic();
    // Pause if mid-game so the player doesn't die while away
    if(phase==='playing'){
      _phaseBeforeHide='playing';
      phase='paused';
      showPauseMenu();
      if(G){ render(); drawPauseOverlay(); }
    } else {
      _phaseBeforeHide=null;
    }
  } else {
    // Tab is visible again — resume AudioContext (iOS always suspends on hide)
    resumeAC();
    // Prune nodes whose scheduled stop time has already passed
    var now3 = AC ? AC.currentTime : 0;
    try{ mNs = mNs.filter(function(o){ return o._stopAt && o._stopAt > now3; }); }catch(e){ mNs=[]; }
    // Restart the correct music for the current phase (respects soundOn)
    // Skip 'paused' — music stays silent while the pause menu is showing;
    // it will restart when the player resumes via togglePause → 'playing'.
    if(phase !== 'paused') startMusicForPhase(phase);
    // Restart render loop unless paused (pause menu waits for user action)
    if(!raf && phase !== 'paused') loop();
  }
});

function togglePause(){

    raf=requestAnimationFrame(loop);

  } else if(phase==='playing'){
    try{ update(); }catch(e){ console.error('update:',e); }
    try{ render(); }catch(e){ console.error('render:',e); }
    raf=requestAnimationFrame(loop);
  } else if(phase==='paused'){
    // Paused: togglePause() already drew one frozen frame+overlay and cancelled raf.
    // If loop() is somehow called while paused (e.g. visibility restore), just draw once.
    render();

  } else if(phase==='gameover'){
    // Animate death particles for a moment before overlay appears
    if(G&&G.pts&&G.pts.length>0){
      for(var i=G.pts.length-1;i>=0;i--){var pt=G.pts[i];pt.x+=pt.vx;pt.y+=pt.vy;pt.vy+=pt.type==='dust'?.05:.35;if(--pt.l<=0)G.pts.splice(i,1);}
      if(G.shake.dur>0){G.shake.dur--;var mag=G.shake.mag*(G.shake.dur/(G.shake.dur_total||1));G.shake.x=(Math.random()*2-1)*mag;G.shake.y=(Math.random()*2-1)*mag;}
      render();
      raf=requestAnimationFrame(loop); // keep animating while particles live
    } else {
      raf=null; // particles done — stop RAF, GS overlay is showing
    }
  } else if(phase==='placita'){
    // La Placita dance scene — accessible from menu or rare post-run trigger
    titleFr++;

// ── Jingle stop system ──
// All jingle gain nodes are stored here so stopAdJingle() can kill them instantly
var _adNodes = [];   // {gain, osc} pairs
var _adJinglePlayed = false;

function stopAdJingle(){
  if(!AC) return;
  var now = AC.currentTime;
  for(var i=0;i<_adNodes.length;i++){
    try{
      _adNodes[i].gain.gain.cancelScheduledValues(now);
      _adNodes[i].gain.gain.setValueAtTime(0, now);
      _adNodes[i].osc.stop(now + 0.01);
    }catch(e){}
  }
  _adNodes = [];
}

// Helper: schedule one oscillator note and register it for killable stop
function _adNote(freq, waveType, vol, startOffset, dur){
  if(!AC || !masterGain) return;
  var o = AC.createOscillator(), g = AC.createGain();
  o.type = waveType || 'square';
  o.frequency.value = freq;
  var t = AC.currentTime + startOffset;
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.01);
  g.gain.linearRampToValueAtTime(vol * 0.8, t + dur * 0.6);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(masterGain);
  o.start(t); o.stop(t + dur + 0.05);
  _adNodes.push({osc:o, gain:g});
}

// Helper: noise hit (snare/shaker)
function _adNoise(vol, startOffset, dur, filterFreq, filterType){
  if(!AC || !masterGain) return;
  var sz = Math.round(AC.sampleRate * dur);
  var buf = AC.createBuffer(1, sz, AC.sampleRate);
  var da = buf.getChannelData(0);
  for(var j=0;j<sz;j++) da[j]=(Math.random()*2-1)*(1-j/sz);
  var src = AC.createBufferSource(), g = AC.createGain(), fi = AC.createBiquadFilter();
  fi.type = filterType||'highpass'; fi.frequency.value = filterFreq||6000;
  g.gain.setValueAtTime(vol, AC.currentTime + startOffset);
  g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + startOffset + dur);
  src.buffer=buf; src.connect(fi); fi.connect(g); g.connect(masterGain);
  src.start(AC.currentTime + startOffset); src.stop(AC.currentTime + startOffset + dur + 0.02);
  _adNodes.push({osc:src, gain:g});
}

// ── Shared chrome drawn over every ad ──
// AD_SKIP_FRAME = 120 (2s), AD_END_FRAME = 360 (6s)
var AD_SKIP_FRAME = 120;
var AD_END_FRAME  = 360;
var AD_ACCENTS=['#e03020','#f8a020','#9020c8','#e03080','#20a8e8','#f8d020','#a8f040','#20e0a0'];

function drawAdChrome(fr, accentCol){
  var canSkip = fr >= AD_SKIP_FRAME;
  var W2=W, H2=H;

  // ── "AD" + "SPONSORED" badge — top-left, small but clear ──
  cx.fillStyle='rgba(0,0,0,0.7)';cx.fillRect(6,6,90,22);
  cx.fillStyle='#fff';cx.font='bold 7px "Press Start 2P"';cx.textAlign='left';
  cx.fillText('AD',12,20);
  cx.fillStyle='#aaa';cx.font='6px "Press Start 2P"';
  cx.fillText('SPONS.',28,20);

  // ── Timer bar — full width bottom strip ──
  var bH=6;
  cx.fillStyle='rgba(0,0,0,0.5)';cx.fillRect(0,H2-bH,W2,bH);
  cx.fillStyle=accentCol;
  cx.fillRect(0,H2-bH,Math.round(W2*Math.min(1,fr/AD_END_FRAME)),bH);

  // ── Skip button — large, mobile-friendly tap target ──
  if(canSkip){
    var pulse=0.7+Math.sin(fr*0.2)*0.3;
    // Button background — full width bottom bar for easy tapping on mobile
    cx.globalAlpha=pulse;
    cx.fillStyle='#000';cx.fillRect(0,H2-52,W2,44);
    cx.fillStyle=accentCol;cx.fillRect(0,H2-54,W2,4);
    cx.globalAlpha=1;
    // "SKIP AD ▶" — big, centered, high contrast
    cx.fillStyle='#fff';cx.font='bold 14px "Press Start 2P"';cx.textAlign='center';
    cx.fillText('SKIP AD ▶',W2/2+2,H2-22);
    cx.fillStyle=accentCol;
    cx.fillText('SKIP AD ▶',W2/2,H2-24);
  } else {
    // Countdown — centered at bottom
    var secsLeft = Math.ceil((AD_SKIP_FRAME - fr) / 60);
    cx.fillStyle='rgba(0,0,0,0.55)';cx.fillRect(0,H2-44,W2,38);
    cx.fillStyle='#888';cx.font='bold 9px "Press Start 2P"';cx.textAlign='center';
    cx.fillText('Skip in '+secsLeft+'s',W2/2,H2-18);
  }
  cx.textAlign='left';
}

// ── Typewriter helper ──
function typeStr(str, fr, startFr){
  if(fr < startFr) return '';
  return str.slice(0, Math.min(str.length, Math.floor((fr-startFr)/2.2)));
}

// ── Ease-out cubic helper ──
function easeOut(t){ return 1-Math.pow(1-Math.min(1,t),3); }

// ── Draw the mini icon for the current ad in the header top-right corner ──
function drawAdIcon(fr){
  // Drop in from above: land at y=44 (centre of 88-90px header bands)
  var dropT = easeOut(Math.min(1,(fr-4)/20));
  var iy = Math.round(-30 + dropT * 74);   // -30 + 74 = 44 final resting y
  var spring = fr>24 ? Math.sin((fr-24)*0.28)*Math.exp(-(fr-24)*0.045)*6 : 0;
  iy = Math.round(iy + spring);
  var wiggle = fr>28 ? Math.sin(fr*0.11)*2.5 : 0;
  var ix = Math.round(W-54 + wiggle);
  var sc = 0.72;
  if(currentAd===0)      drawIcon_Potty(ix, iy, sc);
  else if(currentAd===1) drawIcon_Flan(ix, iy, sc);
  else if(currentAd===2) drawIcon_Bottle(ix, iy, sc);
  else if(currentAd===3) drawIcon_Nail(ix, iy, sc);
  else if(currentAd===4) drawIcon_Piragua(ix, iy, sc);
  else if(currentAd===5) drawIcon_Vinyl(ix, iy, sc);
  else if(currentAd===6) drawIcon_Radio(ix, iy, sc);
  else                   drawIcon_Coquito(ix, iy, sc);
}

// ── Main dispatcher ──
function drawAdScreen(){
  var fr = adFr;
  if(fr===1 && !_adJinglePlayed){ _adJinglePlayed=true; sfxAd(); }

  // Fade in from black
  cx.fillStyle='#000';cx.fillRect(0,0,W,H);
  if(fr < 3) return;
  cx.globalAlpha=Math.min(1,(fr-3)/15);

  if(currentAd===0)      drawAd_PuertoPotties(fr);
  else if(currentAd===1) drawAd_AlejoFlan(fr);
  else if(currentAd===2) drawAd_Limpioso(fr);
  else if(currentAd===3) drawAd_Mariangela(fr);
  else if(currentAd===4) drawAd_PedroPiragua(fr);
  else if(currentAd===5) drawAd_BarrioFrijoles(fr);
  else if(currentAd===6) drawAd_TioMiRespuesta(fr);
  else                   drawAd_BoyCoquito(fr);

  cx.globalAlpha=1;
  drawAdChrome(fr, AD_ACCENTS[currentAd]);
  if(fr>=AD_END_FRAME) skipAd();
}

// Shared icon container — rounded square background with accent ring
function _iconBox(x, y, size, bg, ring){
  cx.fillStyle=bg;
  cx.beginPath();
  var r=6;
  cx.moveTo(x+r,y);cx.lineTo(x+size-r,y);cx.quadraticCurveTo(x+size,y,x+size,y+r);
  cx.lineTo(x+size,y+size-r);cx.quadraticCurveTo(x+size,y+size,x+size-r,y+size);
  cx.lineTo(x+r,y+size);cx.quadraticCurveTo(x,y+size,x,y+size-r);
  cx.lineTo(x,y+r);cx.quadraticCurveTo(x,y,x+r,y);
  cx.closePath();cx.fill();
  cx.strokeStyle=ring;cx.lineWidth=2;cx.stroke();
}

// ── Puerto Potty sprite — pixel-art porta-potty with PR flag colors ──
function drawPuertoPotty(x, y, fr){
  // The potty bobs gently
  var bob = Math.sin(fr * 0.06) * 3;
  y = Math.round(y + bob);

  // Shadow
  cx.globalAlpha = 0.18;
  cx.fillStyle = '#000';
  cx.beginPath();
  cx.ellipse(x + 46, y + 216, 40, 10, 0, 0, Math.PI * 2);
  cx.fill();
  cx.globalAlpha = 1;

  // ── Main body — 3 PR flag horizontal stripes (red/white/red pattern) ──
  var stripes = ['#e03020','#f0f0f0','#e03020','#f0f0f0','#e03020'];
  var sh = 34; // stripe height
  for(var i = 0; i < stripes.length; i++){
    cx.fillStyle = stripes[i];
    cx.fillRect(x + 4, y + 20 + i * sh, 84, sh);
  }

  // Blue left panel (triangle side of PR flag)
  cx.fillStyle = '#0a2a6e';
  cx.beginPath();
  cx.moveTo(x + 4, y + 20);
  cx.lineTo(x + 4, y + 190);
  cx.lineTo(x + 34, y + 105);
  cx.fill();
  // White star on the blue panel
  cx.fillStyle = '#fff';
  cx.font = '14px monospace';
  cx.textAlign = 'center';
  cx.fillText('★', x + 14, y + 112);

  // Body border
  cx.strokeStyle = '#333';
  cx.lineWidth = 3;
  cx.strokeRect(x + 4, y + 20, 84, sh * 5);

  // ── Roof ──
  cx.fillStyle = '#0a2a6e';
  cx.fillRect(x, y + 8, 92, 16);
  cx.fillStyle = '#e03020';
  cx.fillRect(x, y + 4, 92, 6);
  cx.fillStyle = '#fff';
  cx.fillRect(x, y, 92, 5);
  cx.strokeStyle = '#222'; cx.lineWidth = 2;
  cx.strokeRect(x, y + 4, 92, 20);

  // Roof vent / chimney (classic porta-potty detail)
  cx.fillStyle = '#555';
  cx.fillRect(x + 38, y - 10, 16, 16);
  cx.fillStyle = '#333';
  cx.fillRect(x + 36, y - 12, 20, 5);
  // Smell squiggles 🤢 (animated)
  cx.strokeStyle = '#80e040';
  cx.lineWidth = 1.5;
  for(var s = 0; s < 3; s++){
    var sx = x + 40 + s * 7;
    var sy = y - 14 - ((fr * 0.4 + s * 8) % 20);
    cx.globalAlpha = Math.max(0, 1 - (y - 14 - sy + 20) / 20) * 0.7;
    cx.beginPath();
    cx.moveTo(sx, sy);
    cx.quadraticCurveTo(sx - 4, sy - 5, sx, sy - 10);
    cx.quadraticCurveTo(sx + 4, sy - 15, sx, sy - 20);
    cx.stroke();
  }
  cx.globalAlpha = 1;

  // ── Door ──
  cx.fillStyle = '#e8e0d0';
  cx.fillRect(x + 28, y + 100, 40, 90);
  cx.strokeStyle = '#333'; cx.lineWidth = 2;
  cx.strokeRect(x + 28, y + 100, 40, 90);
  // Door crescent moon cutout (outhouse tradition!)
  cx.fillStyle = '#0a2a6e';
  cx.beginPath();
  cx.arc(x + 48, y + 124, 10, 0, Math.PI * 2);
  cx.fill();
  cx.fillStyle = '#e8e0d0';
  cx.beginPath();
  cx.arc(x + 52, y + 121, 8, 0, Math.PI * 2);
  cx.fill();
  // Door handle
  cx.fillStyle = '#888';
  cx.fillRect(x + 63, y + 140, 4, 8);

  // ── "PUERTO POTTIES" label on the door ──
  cx.save();
  cx.fillStyle = '#0a2a6e';
  cx.font = 'bold 4px monospace';
  cx.textAlign = 'center';
  cx.fillText('PUERTO', x + 48, y + 152);
  cx.fillText('POTTIES', x + 48, y + 161);
  cx.restore();

  // ── Base / floor platform ──
  cx.fillStyle = '#888';
  cx.fillRect(x + 2, y + 190, 88, 10);
  cx.fillStyle = '#666';
  cx.fillRect(x + 2, y + 196, 88, 4);
  cx.fillStyle = '#aaa';
  cx.fillRect(x + 4, y + 190, 84, 3);

  // ── Animated sparkles when fully on screen ──
  if(fr > 40){
    var sparkColors = ['#f8d020','#e03020','#0a2a6e','#20e080'];
    for(var sp = 0; sp < 4; sp++){
      var angle = (fr * 0.05 + sp * Math.PI / 2);
      var sr = 52 + Math.sin(fr * 0.07 + sp) * 6;
      var spx = x + 46 + Math.cos(angle) * sr;
      var spy = y + 105 + Math.sin(angle) * sr * 0.35;
      cx.globalAlpha = 0.5 + Math.sin(fr * 0.12 + sp) * 0.4;
      cx.fillStyle = sparkColors[sp];
      cx.font = '9px monospace';
      cx.textAlign = 'center';
      cx.fillText('✦', spx, spy);
    }
    cx.globalAlpha = 1;
  }

  cx.textAlign = 'left';
  cx.lineWidth = 1; // reset — prevent leak into drawAdChrome
}

function drawTitleScreen(){
  var fr=titleFr;

  // ── drawMenuBtn helper — hoisted here to avoid strict-mode block-function error ──
  function drawMenuBtn(label,btnY,col,hlt){
    var bw=340,bh=34,bx=(W-bw)/2;
    cx.fillStyle=hlt?col:'rgba(0,0,0,.75)';
    cx.fillRect(bx,btnY,bw,bh);
    cx.strokeStyle=col;cx.lineWidth=2;cx.strokeRect(bx,btnY,bw,bh);
    cx.fillStyle=hlt?'#000':'#fff';
    cx.font='bold 10px "Press Start 2P"';cx.textAlign='center';
    cx.fillText(label,W/2,btnY+22);
  }

  // ── Shared: animated music notes behind everything ──
  var notes=['♪','♫','♩'];
  for(var i=0;i<5;i++){
    cx.globalAlpha=.22+Math.sin(fr*.05+i)*.18;
    cx.fillStyle=['#ff55cc','#55ffcc','#ffdd44','#aa55ff','#55aaff'][i];
    cx.font='16px monospace';cx.textAlign='left';
    cx.fillText(notes[i%3],((i*110+fr*.8)%W+20),((fr*.5+i*70)%160)+60);
  }
  cx.globalAlpha=1;

  // ── TITLE BOX — PR flag background, gold border (matches screenshot) ──
  var tbx=30, tby=118, tbw=420, tbh=168;

  // 5 horizontal stripes: red/white alternating
  var stripeH=tbh/5;
  var flagStripes=['#e03020','#f0f0f0','#e03020','#f0f0f0','#e03020'];
  for(var si=0;si<5;si++){
    cx.fillStyle=flagStripes[si];
    cx.fillRect(tbx,Math.round(tby+si*stripeH),tbw,Math.ceil(stripeH)+1);
  }

  // Blue equilateral triangle on the left
  cx.fillStyle='#002868';
  cx.beginPath();
  cx.moveTo(tbx, tby);
  cx.lineTo(tbx+tbh*0.82, tby+tbh/2);
  cx.lineTo(tbx, tby+tbh);
  cx.closePath(); cx.fill();

  // White 5-point star in the triangle
  var stx=tbx+tbh*0.28, sty=tby+tbh/2, str=tbh*0.18;
  cx.fillStyle='#fff';
  cx.beginPath();
  for(var pt=0;pt<10;pt++){
    var ang=pt*Math.PI/5-Math.PI/2;
    var r2=pt%2===0?str:str*0.42;
    if(pt===0) cx.moveTo(stx+Math.cos(ang)*r2,sty+Math.sin(ang)*r2);
    else        cx.lineTo(stx+Math.cos(ang)*r2,sty+Math.sin(ang)*r2);
  }
  cx.closePath(); cx.fill();

  // Gold outer border
  cx.strokeStyle='#f8d020'; cx.lineWidth=5;
  cx.strokeRect(tbx,tby,tbw,tbh);
  cx.strokeStyle='#e8b800'; cx.lineWidth=2;
  cx.strokeRect(tbx+5,tby+5,tbw-10,tbh-10);
  cx.lineWidth=1;

  // Title text over flag
  cx.textAlign='center';
  var tBounce=Math.sin(fr*0.06)*3;

  cx.font='bold 52px "Press Start 2P"';
  cx.strokeStyle='#000'; cx.lineWidth=7; cx.lineJoin='round';

  var bounceY=GY-120+Math.sin(fr*.06)*8;
  drawCharAt(CHARS[0],W/2-23,Math.round(bounceY),0,false,false);

  if(titleMode==='menu'){

    // Best score + next unlock progress
    {

    var descY=specY+28;
    // Re-split at 7px (≈5.8px/char) → ~65 chars per line across 378px
    var descLines9=(function(desc){
      var maxW=cardW-40;
      var cpl=Math.floor(maxW/8.2); // chars per line at 9px Press Start 2P
      if(desc.length<=cpl) return [desc];
      var mid=Math.floor(desc.length/2);
      var left=desc.lastIndexOf(' ',mid+8);
      var right=desc.indexOf(' ',mid-8);
      var split=(left<4)?right:(right<0)?left:(Math.abs(left-mid)<Math.abs(right-mid)?left:right);
      if(split<3||split>desc.length-3) return [desc];
      var l1=desc.slice(0,split).trim(), l2=desc.slice(split).trim();
      if(l2.length>cpl){
        var m2=Math.floor(l2.length/2);
        var sp2=l2.lastIndexOf(' ',m2+6);
        if(sp2>3){ return [l1, l2.slice(0,sp2).trim(), l2.slice(sp2).trim()]; }
      }
      return [l1,l2];
    })(ch.desc);
    var descBoxH=descLines9.length===3?62:descLines9.length===2?44:28;

  // Character sprite — centred, bouncing in lower half of card

  // ── NAV ARROWS — large, easy to tap ──
  cx.globalAlpha=0.8;

// ═══════════════════════════════════════════════
//  PROGRESSIVE DIFFICULTY
//  All difficulty params come from one place.
//  dist = metres run. Everything is capped.
//
//  Design goals:
//  • First ~80m are obstacle-free (grace period for new players)
//  • Tall buses ramp in after 80m — standard jumps work early
//  • Speed ramp uses a wider log base so early-game feels relaxed
//  • Spawn variance is LOWER at low dist (predictable) and wider late
//  • Flan spawn rate is higher early (more healing for new players)
//  • Peak difficulty at 800m is identical to before
// ═══════════════════════════════════════════════
function calcDiff(dist,charSpeed){
  // Gentler log curve: base 400 gives ~35% more breathing room early
  // Reaches t=0.5 at ~400m — significantly more relaxed early game
  var t=Math.min(1, Math.log(1+dist/400) / Math.log(1+800/400));

  // ── SPEED ──────────────────────────────────────
  // Same min/max — peak difficulty unchanged at 800m
  var spdMin = 3.8 * charSpeed;
  var spdMax = 8.5 * charSpeed;
  var baseSpd = spdMin + (spdMax - spdMin) * t;

  // ── GUAGUA (BUS) SPAWN GAP ─────────────────────
  // Start: 280 frames → cap: 70 frames (was 260→70)
  // Wider early gap = more time to learn jumping before buses crowd in
  var guaguaMin = Math.max(70, Math.round(320 - 250*t));   // 320→70 (wider early gap)
  var guaguaRand = Math.max(20, Math.round(40 + 20*t));    // 40→60 (same)

  // ── TALL BUS chance ────────────────────────────
  // 0% until 80m, then ramps to 50% at 800m (unchanged)
  var tTall = Math.max(0, (dist-80) / 720);
  var tallChance = Math.min(0.50, 0.50 * Math.min(1, tTall));

  // ── BOTTLE SPAWN GAP ───────────────────────────
  var bottleMin = Math.max(42, Math.round(70 - 28*t));
  var bottleRand = Math.max(20, Math.round(30 - 10*t));
  var airChance = Math.min(0.42, 0.18 + 0.24*t);

  // ── FLAN SPAWN GAP ─────────────────────────────
  // More flans early (150 start) — unchanged
  var flanMin = Math.max(120, Math.min(280, Math.round(150 + 130*t))); // 150→280
  var flanRand = Math.round(60 + 30*t); // 60→90

  // ── DIFFICULTY TIER (0-10 display) ─────────────
  var tier = Math.min(10, Math.floor(t * 10 + 0.5));

  return {
    baseSpd:baseSpd, tier:tier,
    guaguaMin:guaguaMin, guaguaRand:guaguaRand, tallChance:tallChance,
    bottleMin:bottleMin, bottleRand:bottleRand, airChance:airChance,
    flanMin:flanMin, flanRand:flanRand,
  };
}

// ═══════════════════════════════════════════════
//  UPDATE
// ═══════════════════════════════════════════════
function update(){
  var s=G;
  s.fr++;s.dist+=s.spd*.05;s.score=Math.floor(s.dist);

  // ── PROGRESSIVE DIFFICULTY — single source of truth ──
  var charSpeed=CHARS[selectedChar].speed;
  var D=calcDiff(s.dist, charSpeed);

  // Update difficulty tier + fire milestone toast
  s.diff.tier=D.tier;
  if(s.diff.tier>s.diff.lastTier && s.diff.lastTier>=0){
    s.diff.lastTier=s.diff.tier;
    s.diff.tierFlash=180; // ~3 seconds
    // Small non-intrusive toast (not the big power banner)
    showDiffToast(s.diff.tier);
  } else if(s.diff.lastTier<0){
    s.diff.lastTier=0;
  }
  if(s.diff.tierFlash>0) s.diff.tierFlash--;

  // ── EASED SPEED — lerp toward target ──
  s.baseSpd = D.baseSpd;
  s.targetSpd = s.boost>0 ? s.baseSpd*1.75 : s.baseSpd;
  if(s.boost>0){s.boost--;s.fab=Math.max(0,s.fab-.4);}
  s.spd += (s.targetSpd - s.spd) * 0.12;

  s.bgO[0]=(s.bgO[0]+s.spd*.1)%2000;s.bgO[1]=(s.bgO[1]+s.spd*.25)%1600;
  s.bgO[2]=(s.bgO[2]+s.spd*.55)%1200;s.bgO[3]=(s.bgO[3]+s.spd)%80;

  // ── SCREEN SHAKE decay ──
  if(s.shake.dur>0){
    s.shake.dur--;
    var mag=s.shake.mag*(s.shake.dur/s.shake.dur_total||1);
    s.shake.x=(Math.random()*2-1)*mag;
    s.shake.y=(Math.random()*2-1)*mag;
  } else {
    s.shake.x=0;s.shake.y=0;
  }

  // ── HIT FLASH decay ──
  if(s.hitFlash>0) s.hitFlash--;

  // ── SQUASH/STRETCH decay ──
  var sq=s.squash;
  if(sq.t>0){
    sq.t--;
    var prog=sq.t/sq.total;
    // ease back to 1,1
    sq.sx=1+(sq.tx-1)*prog;
    sq.sy=1+(sq.ty-1)*prog;
  } else { sq.sx=1;sq.sy=1; }

  var p=s.p;
  var prevOnGround=s.wasOnGround;

  if(p.flyT>0){
    p.flyT--;p.y=GY-200-Math.sin(s.fr*.05)*18;p.vy=0;
    if(p.flyT===0){p.y=GY;p.jumps=0;}
  } else {
    p.vy+=0.78;
    // ── stretch upward when jumping ──
    if(!p.flyT){
      if(p.vy<-2){
        // ascending — stretch tall
        var stretchAmt=Math.min(1+Math.abs(p.vy)/25,1.18);
        sq.sx=1/stretchAmt;sq.sy=stretchAmt;
      } else if(p.vy>2&&!prevOnGround){
        // falling — squash slightly
        sq.sx=1.08;sq.sy=0.94;
      }
    }
    p.y+=p.vy;
    if(p.y>=GY){
      p.y=GY;
      // ── LAND — squash + dust puff ──
      if(!prevOnGround&&p.vy>3){
        var landSq=Math.min(0.3,p.vy/60);
        setSquash(1+landSq*1.4,1-landSq,8);
        // dust puffs
        for(var d=0;d<5;d++){
          G.pts.push({x:p.x+p.w/2+(d-2)*8,y:GY,
            vx:(Math.random()-.5)*3,vy:-(Math.random()*1.5+0.5),
            col:'#b0a890',sz:4+Math.random()*3,l:14+Math.floor(Math.random()*8),type:'dust'});
        }
      }
      p.vy=0;p.jumps=0;
    }
  }

  s.wasOnGround=(p.y>=GY-1);
  p.rt++;if(p.rt>=6){p.rt=0;p.rf=(p.rf+1)%4;}
  if(p.inv>0){p.inv--;p.flash=s.fr%4<2;}else p.flash=false;
  if(p.grab>0)p.grab--;
  s.hp=Math.max(0,s.hp-.009);
  if(s.cT>0)s.cT--;else s.combo=0;

  // Duran
  if(s.duranT>0){
    s.duranT--;
    if(!s.duran)s.duran={x:p.x-55,pT:0,pA:0};
    s.duran.x+=(p.x-55-s.duran.x)*.14;
    s.duran.pT++;if(s.duran.pT>16){s.duran.pT=0;s.duran.pA=14;}if(s.duran.pA>0)s.duran.pA--;
    for(var i=0;i<s.guaguas.length;i++){var g=s.guaguas[i];if(!g.gone&&g.x-s.duran.x>0&&g.x-s.duran.x<120){g.gone=true;burst(g.x+g.w/2,g.y+g.h/2,'#f8d020',18);sfx('power');showPop('¡NO MÁS!','#f8d020');}}
    if(s.duranT===0)s.duran=null;
  }

  // Clemente — count down and clear when timer expires
  if(s.clementeT>0){
    s.clementeT--;
    if(s.clementeT===0){
      // Timer expired — make sure player is back on the ground
      if(p.y<GY){p.y=GY;p.vy=0;}
      p.jumps=0;
    }
  }

  // Spawns — all intervals driven by calcDiff()
  var sp=s.spd;
  s.gT--;
  if(s.gT<=0){
    var th=Math.random()<D.tallChance;
    // Size variation: short/medium/long for readable, fair variety
    var sizeRoll=Math.random();
    var gSizeMult = sizeRoll<0.3 ? 0.85 : (sizeRoll<0.7 ? 1.0 : 1.15); // short 30% / medium 40% / long 30%
    var gh=th?108:85; var gw=Math.round((th?135:122)*gSizeMult);
    var gType=Math.floor(Math.random()*3); // 0=standard 1=long 2=vintage
    var dispW=gType===1?gw+30:gw;          // long bus looks wider, hitbox unchanged
    s.guaguas.push({x:W+40,y:SURF-gh,w:gw,h:gh,gone:false,cols:rndGC(),gType:gType,dispW:dispW});
    // Ensure minimum gap between spawns scales with bus width for fairness
    var gapBonus = gSizeMult > 1.0 ? 20 : 0;
    s.gT=D.guaguaMin+Math.floor(Math.random()*D.guaguaRand)+gapBonus;
  }
  s.bT--;
  if(s.bT<=0){
    var air=Math.random()<D.airChance;
    s.bottles.push({x:W+20,y:air?SURF-160:SURF-38,w:22,h:38,bob:Math.random()*Math.PI*2});
    s.bT=D.bottleMin+Math.floor(Math.random()*D.bottleRand);
  }
  s.fT--;
  if(s.fT<=0){
    s.flans.push({x:W+20,y:SURF-22,w:28,h:22,gw:0});
    s.fT=D.flanMin+Math.floor(Math.random()*D.flanRand);
  }
  s.pT--;
  if(s.pT<=0){
    s.piraguas.push({x:W+10,y:SURF-52,w:36,h:52,col:['#e03020','#2060e0','#e0a020','#20a840'][Math.floor(Math.random()*4)]});
    s.pT=550+Math.floor(Math.random()*350);
  }

  for(var i=0;i<s.guaguas.length;i++)s.guaguas[i].x-=sp;
  for(var i=0;i<s.bottles.length;i++){s.bottles[i].x-=sp;s.bottles[i].bob+=.07;}
  for(var i=0;i<s.flans.length;i++){s.flans[i].x-=sp;s.flans[i].gw=(s.flans[i].gw+.08)%Math.PI;}
  for(var i=0;i<s.piraguas.length;i++)s.piraguas[i].x-=sp*.55;
  for(var i=0;i<s.palms.length;i++)s.palms[i].sw+=.016;

  // ── BUS COLLISIONS ──
  // Rule 1: player ON TOP of a bus → safe, ride the roof (no damage)
  // Rule 2: player hits the FRONT of a bus → damage (front = left ~22px)
  // Rule 3: player overlaps bus body from the side/rear → no damage (already past it)
  // This lets skilled players run across bus roofs and rewards timing.
  if(p.inv===0&&p.flyT===0&&s.duranT===0&&s.clementeT===0){
    // Inset player box — generous so near-misses feel clean
    var px2=p.x+4, pw2=p.w-8, py2=p.y+4, ph2=p.h-4;
    var pRight=px2+pw2, pBottom=py2+ph2;

    for(var i=0;i<s.guaguas.length;i++){
      var g=s.guaguas[i];
      if(g.gone) continue;

      var bLeft=g.x+5, bRight=g.x+g.w-5; // bus horizontal inset
      var bTop=g.y, bBottom=g.y+g.h;

      // Quick broad-phase reject
      if(pRight<=bLeft||px2>=bRight||pBottom<=bTop||py2>=bBottom) continue;

      // ── TOP ZONE: player feet within 10px of bus roof ──
      // Player is landing or standing on top — no damage, lock feet to roof
      if(pBottom<=bTop+10 && px2<bRight && pRight>bLeft){
        // Snap feet to bus roof — player rides on top
        p.y = bTop - p.h;
        if(p.vy>0) p.vy=0;   // kill downward velocity
        p.jumps=0;            // reset jumps (standing on bus = grounded)
        continue;             // no damage
      }

      // ── FRONT ZONE: left 22px of bus (bus moves left → front is left edge) ──
      // Only this strip causes damage. Running alongside or behind bus = safe.
      var bFrontRight = g.x + 27; // 5px inset + 22px front zone
      if(px2 < bFrontRight){
        // Player is hitting the front face
        s.hp=Math.max(0,s.hp-25); p.inv=80; s.combo=0;
        triggerShake(7,18);
        s.hitFlash=14;
        setSquash(1.3,0.7,12);
        burst(p.x+p.w/2,p.y+p.h/2,'#f06020',20);
        burst(p.x+p.w/2,p.y+p.h/2,'#fff',6);
        sfx('hurt');
        if(s.hp<=0){doGameOver();return;}
        break;
      }
      // If we're here player overlaps the bus body/rear — safe (already jumped over front)
    }
  }
  // Bottles
  for(var i=0;i<s.bottles.length;i++){
    var b=s.bottles[i];
    if(!b.hit&&ov(p,b)){b.hit=true;s.fab=Math.min(100,s.fab+28);s.boost=Math.min(s.boost+130,300);s.combo++;s.cT=80;s.score+=50*s.combo;p.grab=15;showPop('¡RÁPIDO!','#c828e8');burst(b.x+b.w/2,b.y+b.h/2,'#9820c8',10);sfx('bottle');sfx('score');}
  }
  // Flans
  for(var i=0;i<s.flans.length;i++){
    var fl=s.flans[i];
    if(!fl.hit&&ov(p,fl)){fl.hit=true;s.hp=Math.min(s.maxHp,s.hp+20);s.flanCount++;s.totalFlans++;s.score+=200;var flanTxt=s.flanCount>=15?'¡WEPA! 🍮×'+s.flanCount:s.flanCount>=8?'¡QUÉ RICO! 🍮':s.flanCount%5===0?'🍮×'+s.flanCount+'  ¡DALE!':'🍮 +HP';showPop(flanTxt,'#f8d020');burst(fl.x+fl.w/2,fl.y+fl.h/2,'#f0b020',16);sfx('flan');if(s.flanCount===8)activateDuran();else if(s.flanCount>=15){activateClemente();s.flanCount=0;}}
  }

  // In-place removal — no new array allocation each frame
  for(var i=s.guaguas.length-1;i>=0;i--){if(s.guaguas[i].x<=-220)s.guaguas.splice(i,1);}
  for(var i=s.bottles.length-1;i>=0;i--){if(s.bottles[i].x<=-55||s.bottles[i].hit)s.bottles.splice(i,1);}
  for(var i=s.flans.length-1;i>=0;i--){if(s.flans[i].x<=-55||s.flans[i].hit)s.flans.splice(i,1);}
  for(var i=s.piraguas.length-1;i>=0;i--){if(s.piraguas[i].x<=-70)s.piraguas.splice(i,1);}
  for(var i=s.pts.length-1;i>=0;i--){
    var pt=s.pts[i];
    pt.x+=pt.vx;pt.y+=pt.vy;
    pt.vy+=pt.type==='dust'?.05:.35;
    if(--pt.l<=0)s.pts.splice(i,1);
  }

  $ef.style.width=s.hp+'%';
  $ef.style.background=s.hp>50?'#20c030':s.hp>25?'#e0a020':'#e03020';
  $ff2.style.width=s.fab+'%';
  $flanct.textContent='x'+s.flanCount;
  $scorehud.textContent=s.score+'m';
  $coinhud.textContent='🍮'+totalFlansEver;
}

function ov(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
function triggerShake(mag,dur){if(!G)return;G.shake.mag=mag;G.shake.dur=dur;G.shake.dur_total=dur;}
function setSquash(sx,sy,frames){if(!G)return;var sq=G.squash;sq.tx=sx;sq.ty=sy;sq.sx=sx;sq.sy=sy;sq.total=frames;sq.t=frames;}
function burst(x,y,col,n){if(!G)return;var room=Math.max(0,200-G.pts.length);n=Math.min(n,room);for(var i=0;i<n;i++)G.pts.push({x:x,y:y,vx:(Math.random()-.5)*8,vy:(Math.random()-.5)*7-2.5,col:col,sz:3+Math.random()*5,l:20+Math.random()*12});}

  startMusicForPhase('placita');

function drawPlacitaScene(fr){
  // ═══ DISCOTECITA — all 8 characters visible, DJ booth compact on right ═══
  var FLOOR = 432;
  var dotCols=['#ff2080','#40c8ff','#ffdd00','#40ff80','#ff6020','#c040ff'];

  // ── BACKGROUND ──
  var bg=cx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#1a0038');bg.addColorStop(0.6,'#2e0055');bg.addColorStop(1,'#3a0066');
  cx.fillStyle=bg;cx.fillRect(0,0,W,H);

  // ── LIGHT SWEEPS ──
  for(var sw=0;sw<3;sw++){
    var sweepX=((fr*2.2+sw*155)%(W+220))-110;
    var sg=cx.createLinearGradient(sweepX-55,0,sweepX+55,0);
    sg.addColorStop(0,'rgba(255,255,255,0)');
    sg.addColorStop(0.5,'rgba(255,255,255,0.06)');
    sg.addColorStop(1,'rgba(255,255,255,0)');
    cx.fillStyle=sg;cx.fillRect(sweepX-55,0,110,H);
  }

  // ── TWINKLING STARS ──
  var starPos=[[38,72,2],[88,44,1.5],[128,82,2],[190,36,1],[250,68,2.5],[300,52,2],[370,78,1.5],[420,40,1],[62,118,1.5],[330,112,2],[450,92,1.5]];
  for(var si=0;si<starPos.length;si++){
    var sp=starPos[si];
    var blink=0.4+Math.sin(fr*0.08+si*1.3)*0.55;
    cx.globalAlpha=Math.max(0,blink);
    cx.fillStyle='#fff';
    cx.fillRect(sp[0]-sp[2]/2,sp[1]-sp[2]/2,sp[2],sp[2]);
  }
  cx.globalAlpha=1;

  // ── FLOOR — shiny dark tiles ──
  f('#0d0420',0,FLOOR,W,H-FLOOR);
  f('#160830',0,FLOOR,W,3);
  cx.globalAlpha=0.1;cx.fillStyle='#fff';
  for(var ti=0;ti<W;ti+=44){cx.fillRect(ti,FLOOR,1,H-FLOOR);}
  for(var tj=FLOOR;tj<H;tj+=44){cx.fillRect(0,tj,W,1);}
  cx.globalAlpha=1;

  // ── DJ BOOTH — compact, right edge, 120px wide ──
  var bpw=120, bpx=W-bpw;
  var bph=250, bpy=FLOOR-bph;
  var djy=FLOOR-40;
  f('#140530',bpx,bpy,bpw,bph);
  f('#1e0848',bpx,bpy,bpw,4);
  f('#1e1840',bpx+4,djy,bpw-8,40);
  f('#2a245a',bpx+4,djy,bpw-8,4);
  for(var b=0;b<5;b++){
    var bh2=3+((fr*0.25+b*4|0)%10);
    f(dotCols[b%dotCols.length],bpx+10+b*20,djy+22-bh2,12,bh2);
  }
  if(_djGatorImg.complete && _djGatorImg.naturalWidth>0){
    var natW=_djGatorImg.naturalWidth, natH=_djGatorImg.naturalHeight;
    var maxW=bpw-12, maxH=djy-(bpy+30);
    var sc=Math.min(maxW/natW, maxH/natH);
    var giw=Math.round(natW*sc), gih=Math.round(natH*sc);
    var gix=Math.round(bpx+(bpw-giw)/2);
    var gBob=Math.round(Math.sin(fr*0.16)*3);
    var gLean=Math.sin(fr*0.10)*0.022;
    var giy=djy-gih+gBob;
    cx.save();
    cx.translate(gix+giw/2,giy+gih);
    cx.rotate(gLean);
    cx.drawImage(_djGatorImg,-giw/2,-gih,giw,gih);
    cx.restore();
  }

  // ── LEFT SPEAKER — far left, flush to floor ──
  f('#1a1828',4,FLOOR-130,40,130);f('#252335',6,FLOOR-128,36,126);
  cx.fillStyle='#2a2840';cx.beginPath();cx.arc(24,FLOOR-84,16,0,Math.PI*2);cx.fill();
  cx.fillStyle='#383050';cx.beginPath();cx.arc(24,FLOOR-84,11,0,Math.PI*2);cx.fill();
  cx.fillStyle='#222232';cx.beginPath();cx.arc(24,FLOOR-84,4,0,Math.PI*2);cx.fill();
  cx.fillStyle='#2a2840';cx.beginPath();cx.arc(24,FLOOR-40,8,0,Math.PI*2);cx.fill();

  // ── RIGHT SPEAKER — just left of DJ booth ──
  var rspx=bpx-42;
  f('#1a1828',rspx,FLOOR-130,40,130);f('#252335',rspx+2,FLOOR-128,36,126);
  cx.fillStyle='#2a2840';cx.beginPath();cx.arc(rspx+20,FLOOR-84,16,0,Math.PI*2);cx.fill();
  cx.fillStyle='#383050';cx.beginPath();cx.arc(rspx+20,FLOOR-84,11,0,Math.PI*2);cx.fill();
  cx.fillStyle='#222232';cx.beginPath();cx.arc(rspx+20,FLOOR-84,4,0,Math.PI*2);cx.fill();
  cx.fillStyle='#2a2840';cx.beginPath();cx.arc(rspx+20,FLOOR-40,8,0,Math.PI*2);cx.fill();

  // ── DISCO BALL — centred ──
  var dbx=W/2, dby=62;
  cx.strokeStyle='#888';cx.lineWidth=1;
  cx.beginPath();cx.moveTo(dbx,0);cx.lineTo(dbx,dby-20);cx.stroke();cx.lineWidth=1;
  cx.globalAlpha=0.18+Math.sin(fr*0.07)*0.08;
  cx.fillStyle='#ff00ff';cx.beginPath();cx.arc(dbx,dby,34,0,Math.PI*2);cx.fill();
  cx.globalAlpha=1;
  var ballGrad=cx.createRadialGradient(dbx-6,dby-6,2,dbx,dby,20);
  ballGrad.addColorStop(0,'#ffffff');ballGrad.addColorStop(0.4,'#ccccff');ballGrad.addColorStop(1,'#8888bb');
  cx.fillStyle=ballGrad;cx.beginPath();cx.arc(dbx,dby,20,0,Math.PI*2);cx.fill();
  cx.save();cx.translate(dbx,dby);cx.rotate(fr*0.04);
  cx.globalAlpha=0.28;cx.strokeStyle='#6070a0';cx.lineWidth=0.8;
  for(var bt=-3;bt<=3;bt++){
    cx.beginPath();cx.moveTo(-20,bt*5);cx.lineTo(20,bt*5);cx.stroke();
    cx.beginPath();cx.moveTo(bt*5,-20);cx.lineTo(bt*5,20);cx.stroke();
  }
  cx.restore();cx.globalAlpha=1;
  cx.fillStyle='rgba(255,255,255,0.7)';cx.beginPath();cx.arc(dbx-6,dby-6,6,0,Math.PI*2);cx.fill();
  for(var d=0;d<10;d++){
    var da=fr*0.05+d*(Math.PI*2/10);
    var dlx=dbx+Math.cos(da)*210, dly=dby+Math.sin(da)*82;
    if(dly<0||dlx<0||dlx>W) continue;
    cx.globalAlpha=0.25+Math.sin(fr*0.10+d)*0.22;
    cx.fillStyle=dotCols[d%dotCols.length];
    var dsz=3+Math.sin(fr*0.08+d)*1.5;
    cx.fillRect(Math.round(dlx)-dsz/2,Math.round(dly)-dsz/2,dsz,dsz);
  }
  cx.globalAlpha=1;

  // ── DANCE FLOOR — characters across full available width ──
  // Available x: 48 (clear of left speaker) to rspx-6 (clear of right speaker)
  var danceLeft=48, danceRight=rspx-6, danceW=danceRight-danceLeft;

  // Front row: 4 iconic silhouettes — Alejo, Pedro, Abuela, Yanqui
  var frontOrder=[0,1,3,4];
  var fCellW=Math.floor(danceW/4);
  for(var ci=0;ci<4;ci++){
    var ch=CHARS[frontOrder[ci]];
    var bobY=Math.round(Math.sin(fr*0.16+ci*1.4)*6);
    var cw=ch.id==='mariangela'?52:ch.id==='chicito'?50:ch.id==='yanqui'?50:46;
    var charH=ch.id==='abuela'?56:ch.id==='chicito'?70:64;
    var cx2=danceLeft+ci*fCellW+Math.floor((fCellW-cw)/2);
    var cy2=FLOOR-charH+bobY;
    drawCharAt(ch,cx2,cy2,Math.floor(fr/8)%4,false,false);
  }

  // Back row: 4 interleaved — Mariangela, Conejito, Antonio, Chicito
  // Offset by half a cell, scaled 0.80, feet 22px above front row
  var backOrder=[2,5,6,7];
  var backScale=0.80;
  var halfCell=Math.floor(fCellW/2);
  for(var ci=0;ci<4;ci++){
    var ch=CHARS[backOrder[ci]];
    var bobY=Math.round(Math.sin(fr*0.16+ci*1.3+0.8)*4);
    var cw=ch.id==='mariangela'?52:ch.id==='chicito'?50:ch.id==='yanqui'?50:46;
    var charH=ch.id==='abuela'?56:ch.id==='chicito'?70:64;
    var feetY=FLOOR-22+bobY;
    var cx2=danceLeft+halfCell+ci*fCellW+Math.floor((fCellW-Math.round(cw*backScale))/2);
    var cy2=feetY-Math.round(charH*backScale);
    cx.save();
    cx.globalAlpha=0.84;
    cx.translate(Math.round(cx2+cw*backScale/2),feetY);
    cx.scale(backScale,backScale);
    cx.translate(-Math.round(cx2+cw/2),-feetY);
    drawCharAt(ch,cx2,cy2,Math.floor(fr/10)%4,false,false);
    cx.restore();
    cx.globalAlpha=1;
  }

  // ── ¡WEPA! flash ──
  if(Math.sin(fr*0.18)>0.88){
    cx.globalAlpha=0.92;
    cx.fillStyle=dotCols[Math.floor(fr/28)%dotCols.length];
    cx.font='bold 18px "Press Start 2P"';cx.textAlign='center';
    cx.fillText('\u00a1WEPA!',(danceLeft+danceRight)/2,FLOOR-90);
    cx.globalAlpha=1;cx.textAlign='left';
  }

  // ── EXIT BUTTON ──
  var btnY=H-66;
  cx.globalAlpha=0.90+Math.sin(fr*0.08)*0.08;
  cx.fillStyle='rgba(0,0,0,.92)';cx.fillRect(16,btnY,W-32,44);
  cx.strokeStyle='#20e080';cx.lineWidth=2;cx.strokeRect(16,btnY,W-32,44);cx.lineWidth=1;
  cx.globalAlpha=1;
  cx.fillStyle='#20e080';cx.font='bold 9px "Press Start 2P"';cx.textAlign='center';
  cx.fillText('Se acab\u00f3 la fiesta',W/2,btnY+17);
  cx.fillStyle='#777';cx.font='5px "Press Start 2P"';
  cx.fillText('tap to return to menu',W/2,btnY+32);
  cx.textAlign='left';cx.lineWidth=1;cx.globalAlpha=1;
}
// ── Exit La Placita — returns to origin (menu or game-over) ──
function exitPlacita(){

  if(placitaSource==='gameover'){
    // Came from a post-run trigger — show game-over overlay
    phase='gameover';

  } else {
    // Came from main menu button — return to title
    backToTitle();
  }

var gameoverTO = null; // handle for the 420ms death-animation delay

function doGameOver(){
  phase='gameover';
  stopMusic();
  // ── DEATH EXPLOSION — big multi-color burst ──
  if(G&&G.p){
    var px=G.p.x+G.p.w/2,py=G.p.y+G.p.h/2;
    var deathCols=['#e03020','#f8d020','#9820c8','#20c8e8','#fff','#f06020','#20e080'];
    for(var di=0;di<40;di++){
      var angle=Math.random()*Math.PI*2;
      var spd=2+Math.random()*7;
      G.pts.push({x:px,y:py,vx:Math.cos(angle)*spd,vy:Math.sin(angle)*spd-3,col:deathCols[di%deathCols.length],sz:4+Math.random()*7,l:35+Math.floor(Math.random()*25)});
    }
    triggerShake(12,25);
    if(gameoverTO) clearTimeout(gameoverTO);
    gameoverTO = setTimeout(function(){
      gameoverTO = null;
      // Guard: if player already restarted before timeout fired, bail out
      if(phase !== 'gameover') return;
      newRecord=false;
      if(G.score>best){
        best=G.score;newRecord=true;
        try{localStorage.setItem(HS_KEY,String(best));}catch(e){}
        sfxNewRecord();
      }

      // ── SECTION 3: Guarantee minimum flan reward every run ──
      var earned = G.totalFlans;
      var minFlan = G.score >= 200 ? 5 : G.score >= 50 ? 3 : G.score >= 20 ? 2 : 1; // always reward something
      if(earned < minFlan){ earned = minFlan; }
      var preTotal = totalFlansEver;
      addFlans(earned); // persists and checks auto-unlocks

      // ── SECTION 5: Detect fresh unlocks ──
      var freshUnlock = null;
      if(!ALL_CHARACTERS_UNLOCKED){
        CHARS.forEach(function(ch){
          if(ch.cost>0 && unlockedSet.indexOf(ch.id)>=0 && preTotal<ch.cost && totalFlansEver>=ch.cost){
            freshUnlock = ch;
          }
        });
      }

      // ── SECTION 1 + 2: Find next locked character and near-miss ──
      var nextLocked = null;
      if(!ALL_CHARACTERS_UNLOCKED){
        CHARS.forEach(function(ch){
          if(ch.cost>0 && unlockedSet.indexOf(ch.id)<0 && !nextLocked) nextLocked=ch;
        });
      }

      // ── Update all game-over stat elements (null-guarded: gce/gct may be absent after innerHTML rewrites on prior runs) ──
      var _gsc=document.getElementById('gsc'); if(_gsc) _gsc.textContent=G.score;
      var _gfl=document.getElementById('gfl'); if(_gfl) _gfl.textContent=earned;
      var _gbe=document.getElementById('gbe'); if(_gbe) _gbe.textContent=best;
      var _gce=document.getElementById('gce'); if(_gce) _gce.textContent='+'+earned;
      var _gct=document.getElementById('gct'); if(_gct) _gct.textContent=totalFlansEver;
      var nhs=document.getElementById('newHSBanner');
      if(nhs) nhs.style.display=newRecord?'block':'none';

      // ── SECTION 5: Unlock celebration — overwrite coinTotal line ──
      var ctEl=document.getElementById('coinTotal');
      if(freshUnlock && ctEl){
        // Unlock celebration — gct span not needed here; will be restored on next non-unlock path
        ctEl.innerHTML='<span style="color:#f8d020;font-size:8px;">🎉 UNLOCKED: '+freshUnlock.name+'! 🎉</span><span id="gct" style="display:none;">'+totalFlansEver+'</span>';
        sfx('flan'); sfx('score');
      } else if(ctEl){
        // ── SECTION 1: Always show progress toward next unlock ──
        if(nextLocked && !ALL_CHARACTERS_UNLOCKED){
          var prog=Math.min(totalFlansEver,nextLocked.cost);
          var pct=Math.round(prog/nextLocked.cost*100);
          ctEl.innerHTML='TOTAL: <span id="gct">'+totalFlansEver+'</span> 🍮 &nbsp;|&nbsp; <span style="color:#20e080;">'+prog+'/'+nextLocked.cost+' for '+nextLocked.name+'</span>';
        } else {
          ctEl.innerHTML='TOTAL FLANS: <span id="gct">'+totalFlansEver+'</span> 🍮';
        }
      }

      // ── SECTION 2: Near-miss message in coinEarned line ──
      var ceEl=document.getElementById('coinEarned');
      if(ceEl){
        if(freshUnlock){
          ceEl.innerHTML='🏆 <span style="color:#f8d020;">NEW CHARACTER UNLOCKED!</span><span id="gce" style="display:none;">+'+earned+'</span>';
        } else if(nextLocked && !ALL_CHARACTERS_UNLOCKED){
          var gap=nextLocked.cost-totalFlansEver;
          if(gap<=5 && gap>0){
            ceEl.innerHTML='🍮 <span id="gce">+'+earned+'</span> &nbsp;<span style="color:#20e080;font-size:6px;">SO CLOSE! '+gap+' more 🍮 to unlock '+nextLocked.name+'!</span>';
          } else if(gap<=10 && gap>0){
            ceEl.innerHTML='🍮 <span id="gce">+'+earned+'</span> &nbsp;<span style="color:#aaa;font-size:6px;">Almost! '+gap+' 🍮 to go!</span>';
          } else {
            ceEl.innerHTML='🍮 <span id="gce">+'+earned+'</span> FLANS THIS RUN';
          }
        } else {
          ceEl.innerHTML='🍮 <span id="gce">+'+earned+'</span> FLANS THIS RUN';
        }
      }

      // Update share button
      var sBtn=document.getElementById('shareBtn');
      if(sBtn) sBtn.textContent='📤 SHARE: '+G.score+'m AS '+CHARS[selectedChar].name;
      var sfb=document.getElementById('shareFeedback');
      if(sfb){sfb.textContent='';sfb.style.opacity='0';}
      document.getElementById('GS').style.display='flex';
    },200);
  } else {
    document.getElementById('GS').style.display='flex';
  }
}

// Build the share text from current game state
function buildShareMsg(){
  var charName = G ? CHARS[selectedChar].name : 'WEPA MAN';
  var score    = G ? G.score : 0;
  var flans    = G ? G.totalFlans : 0;
  var hs       = best;
  var emojis   = score >= 500 ? '🔥🔥🔥' : score >= 200 ? '🔥🔥' : '🔥';
  var msg = emojis + ' I ran ' + score + 'm as ' + charName
          + ' in ¡WEPA RUN!! '
          + '(' + flans + ' 🍮 collected)\n'
          + '🏆 My best: ' + hs + 'm\n'
          + 'Can you beat me? 👟🎺🇵🇷';
  return msg;
}

// Show feedback text under the share button, auto-clears after 2.5s
var shareFeedbackTO;
function showShareFeedback(msg, color){
  var el = document.getElementById('shareFeedback');
  if(!el) return;
  el.textContent = msg;
  el.style.color  = color || '#20e080';
  el.style.opacity = '1';
  clearTimeout(shareFeedbackTO);
  shareFeedbackTO = setTimeout(function(){
    el.style.opacity = '0';
  }, 2500);
}

// Main share handler — tries Web Share API, then Clipboard API, then prompt fallback
function shareScore(){
  var msg  = buildShareMsg();
  var btn  = document.getElementById('shareBtn');

  // ── 1. Web Share API (native sheet on iOS/Android) ──
  if(navigator.share){
    navigator.share({
      title: '¡Wepa Run!',
      text:  msg
    }).then(function(){
      showShareFeedback('¡COMPARTIDO! 🎉', '#20e080');
    }).catch(function(err){
      // User cancelled — not an error worth surfacing
      if(err && err.name !== 'AbortError'){
        copyFallback(msg);
      }
    });
    return;
  }

  // ── 2. Clipboard API fallback (modern desktop browsers) ──
  copyFallback(msg);
}

function copyFallback(msg){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(msg).then(function(){
      showShareFeedback('✓ COPIED TO CLIPBOARD!', '#20e080');
    }).catch(function(){
      promptFallback(msg);
    });
  } else {
    // ── 3. Last resort — execCommand or manual prompt ──
    promptFallback(msg);
  }
}

function promptFallback(msg){
  // Try the old execCommand method first (still works on older Android WebViews)
  try{
    var ta = document.createElement('textarea');
    ta.value = msg;
    ta.style.cssText = 'position:fixed;top:-9999px;left:-9999px;opacity:0;';
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    var ok = document.execCommand('copy');
    document.body.removeChild(ta);
    if(ok){
      showShareFeedback('✓ COPIED TO CLIPBOARD!', '#20e080');
      return;
    }
  } catch(e){}
  // Absolute last resort — show the text in a prompt so users can copy manually
  window.prompt('Copy your score and share it!', msg);
}

function render(){

  // ── SCREEN SHAKE — translate entire scene ──
  cx.save();

  drawSalsaBG();
  drawPiraguas();
  drawGround();
  drawFlans();
  drawBottles();
  drawGuaguas();
  if(G.duran) drawDuran();
  if(G.clementeT>0) drawClemente();

  if(!G.p.flash){
    var p=G.p,rf=p.rf,grab=p.grab>0,turbo=G.boost>0;
    var sq=G.squash;

    // Fly/turbo trail effects (drawn before char, outside squash transform)
    if(p.flyT>0){
      for(var i=0;i<4;i++){cx.globalAlpha=.25+i*.08;f(['#f8d020','#9820c8','#20c8e8','#e03080'][i],p.x-5+i*4,p.y+p.h*.28,p.w+2,p.h*.5);}
      cx.globalAlpha=1;

    // ── SQUASH/STRETCH — pivot at player feet ──
    var cx_=Math.round(p.x+p.w/2);
    var cy_=Math.round(p.y+p.h);
    cx.save();
    cx.translate(cx_,cy_);
    cx.scale(sq.sx,sq.sy);
    cx.translate(-cx_,-cy_);
    drawCharAt(CHARS[selectedChar],Math.round(p.x),Math.round(p.y),rf,grab,turbo);

  drawPts();
